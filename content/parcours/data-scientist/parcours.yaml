slug: data-scientist
title: Data Scientist
tagline: Modéliser l'incertitude et construire des modèles utiles, évalués et déployables.
description: >-
  Un parcours complet et orienté pratique pour devenir Data Scientist : Python scientifique,
  statistiques et probabilités, exploration et features, apprentissage supervisé et non supervisé,
  évaluation sans se tromper, séries temporelles, traitement du langage, introduction au deep
  learning, mise à disposition d'un modèle, suivi de la dérive et explicabilité. Chaque chapitre
  se termine par des exercices et une évaluation à valider avec au moins 75 %.
level: Débutant à avancé
domain: Data
skills:
  - Statistiques
  - Feature engineering
  - Machine learning
  - Deep learning
  - Mise en production
color: plum
icon: flask
order: 6
status: published
prerequisites:
  - Savoir programmer en Python (variables, fonctions, boucles, lecture d'un fichier)
  - Notions de mathématiques du lycée (fonctions, pourcentages, probabilités simples)
  - Avoir déjà écrit une requête SQL simple est utile, sans être obligatoire
outcomes:
  - Cadrer un problème de prédiction ou de segmentation et poser une baseline
  - Préparer des données et construire des features sans fuite d'information
  - Entraîner et comparer des modèles supervisés et non supervisés
  - Choisir des métriques et une validation adaptées au contexte métier
  - Traiter une série temporelle simple et un texte court
  - Décider quand un réseau de neurones est justifié
  - Servir un modèle, surveiller sa dérive et expliquer une prédiction
  - Rédiger un rapport d'expérimentation reproductible
