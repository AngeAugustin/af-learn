modules:
  - slug: fondations
    title: Fondations du Data Scientist
    description: Le métier, Python scientifique et un environnement d'expérimentation reproductible.
    chapters: [metier-data-scientist, python-scientifique, environnement-reproductible]
  - slug: maths-stats
    title: Mathématiques et statistiques
    description: Vecteurs et matrices, probabilités, inférence et descente de gradient, au service des modèles.
    chapters: [algebre-vecteurs-matrices, proba-bayes, stats-inference, optimisation-gradient]
  - slug: features
    title: Données et feature engineering
    description: Explorer, traiter les manquants, fabriquer des variables et les enchaîner dans un pipeline.
    chapters: [exploration-eda, nettoyage-valeurs-manquantes, feature-engineering, pipelines-sklearn]
  - slug: supervise
    title: Apprentissage supervisé
    description: Régression, classification, arbres et forêts, méthodes à noyau, avec le bon usage de chacune.
    chapters: [regression, classification, arbres-ensembles, svm-methodes-kernel]
  - slug: evaluation
    title: Évaluation et expérimentation
    description: Métriques, validation, biais-variance, fuite de données et suivi des expériences.
    chapters: [metriques-validation, biais-variance-leakage, tracking-experiences]
  - slug: non-supervise
    title: Non supervisé et réduction de dimension
    description: Regrouper, compresser et détecter l'inhabituel quand il n'y a pas d'étiquette.
    chapters: [clustering, pca-embeddings-simples, detection-anomalies]
  - slug: series-nlp
    title: Séries temporelles et texte
    description: Décomposer une série, prévoir, représenter un texte et classer des documents.
    chapters: [series-temporelles, forecasting, nlp-fondamentaux, classification-texte]
  - slug: deep-learning
    title: Deep learning appliqué
    description: Réseaux de neurones en pratique, une introduction à la vision, et quand s'arrêter avant le deep learning.
    chapters: [reseaux-neurones-pratique, cnn-vision-intro, quand-utiliser-dl]
  - slug: mlops
    title: Mise en production et responsabilité
    description: Servir un modèle, détecter la dérive, réentraîner, expliquer et encadrer l'usage.
    chapters: [servir-modele-api, monitoring-derive, retraining-ci, ethique-explicabilite]
  - slug: projet
    title: Projet scientifique
    description: Du cadrage à la baseline, du modèle au rapport, puis un projet final complet.
    chapters: [cadrage-probleme-ml, baseline-au-modele, rapport-scientifique, projet-final]
