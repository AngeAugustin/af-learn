questions:
  - prompt: À quoi sert le jeu de test dans une expérience bien menée ?
    options:
      - À choisir le pas d'apprentissage à chaque essai
      - À fournir une mesure finale sur des données que les réglages n'ont pas consultées
      - À remplacer la validation croisée pendant l'entraînement
      - À augmenter le volume d'entraînement de 15 %
    answer: [1]
    explanation: Le test est un juge. Dès qu'on s'en sert pour choisir un réglage, il n'est plus indépendant.

  - prompt: Vous avez 8 % de résiliations. Le test tiré au hasard n'en contient aucune. Que s'est-il passé ?
    options:
      - Le modèle est parfait
      - Le découpage n'a pas respecté la proportion de la classe rare
      - La métrique F1 est devenue inutile par définition mathématique seule
      - Il faut prédire la moyenne
    answer: [1]
    explanation: Sans stratification, un petit test peut rater la classe rare et ne plus rien mesurer.

  - prompt: Pourquoi ne mélange-t-on pas les mois quand on prévoit le trimestre prochain ?
    options:
      - Parce que les forêts aléatoires l'interdisent
      - Parce que le modèle verrait le futur dans l'entraînement et le passé dans le test
      - Parce que la stratification est impossible avec des dates
      - Parce que l'accuracy exige un ordre alphabétique
    answer: [1]
    explanation: Le test temporel est la période la plus récente. Le modèle n'apprend que sur ce qui précède.

  - prompt: Un client a six lignes. Où doivent-elles aller ?
    options:
      - Trois en entraînement, trois en test, pour équilibrer
      - Toutes dans la même partie, afin que le modèle ne reconnaisse pas une personne déjà vue
      - Uniquement dans le test
      - On les supprime, les répétitions sont interdites
    answer: [1]
    explanation: Le groupe (ici le client) ne traverse pas la frontière entre apprentissage et évaluation.

  - prompt: "Un modèle dit « personne ne résilie » et obtient 92 % d'accuracy. Que conclure ?"
    options:
      - Il est prêt pour la production
      - Il rate tous les résiliants. L'accuracy est trompeuse si la classe utile est rare
      - Le rappel vaut 92 %
      - La calibration est parfaite
    answer: [1]
    explanation: Bien classer la majorité ne détecte aucun départ. Il faut précision, rappel ou un coût.

  - prompt: Parmi les alertes émises, quelle part est vraiment positive ?
    options:
      - Le rappel
      - La précision
      - L'accuracy
      - La variance du pli
    answer: [1]
    explanation: La précision regarde les alertes. Le rappel regarde les vrais cas, alertés ou non.

  - prompt: L'équipe fraude ne peut lire que 200 dossiers par jour. Quelle consigne est actionnable ?
    options:
      - Maximiser l'accuracy sur tout le flux
      - Transmettre les 200 scores les plus élevés et mesurer la qualité dans cette file
      - Baisser le seuil jusqu'à 10 000 alertes
      - Entraîner jusqu'à 100 % de rappel sans contrainte
    answer: [1]
    explanation: La capacité de lecture borne le nombre d'alertes. Le score sert à ranger, pas à tout signaler.

  - prompt: Cinq plis donnent 0,71, 0,74, 0,69, 0,73 et 0,72. Que publiez-vous ?
    options:
      - 0,74, le meilleur pli
      - Environ 0,72, avec l'écart entre les plis
      - La moyenne du jeu de test calculée cinq fois
      - 1, car la somme dépasse 1
    answer: [1]
    explanation: La validation croisée s'annonce par sa moyenne et sa dispersion, pas par le pli chanceux.

  - prompt: Un score de 0,8 est attribué à des clients qui ne partent que dans 40 % des cas. Que manque-t-il ?
    options:
      - De la stratification
      - Une calibration. Le rang peut être bon alors que la probabilité annoncée est fausse
      - Une accuracy plus élevée
      - Un flocon de neige
    answer: [1]
    explanation: Bien ordonner les risques ne garantit pas qu'un score de 0,8 signifie 80 %.

  - prompt: Quelles pratiques respectent le rôle du jeu de test ? (plusieurs réponses)
    multiple: true
    options:
      - Figer modèle et réglages à partir de la validation seulement
      - Regarder le test une fois, à la fin
      - Choisir le seuil qui maximise le score de test parmi 14 essais
      - Garder le test hors des plis de validation croisée
    answer: [0, 1, 3]
    explanation: Le test ne participe ni au choix des réglages ni aux plis. Un seul passage final.

  - prompt: Quelles métriques sont adaptées à une prévision de montant en euros ? (plusieurs réponses)
    multiple: true
    options:
      - MAE
      - RMSE
      - Rappel d'une classe
      - Accuracy de classification
    answer: [0, 1]
    explanation: MAE et RMSE mesurent un écart de montant. Rappel et accuracy supposent des classes.

  - prompt: "Vous imposez : détecter des résiliants, mais avec au moins 30 % de précision. Que décrivez-vous ?"
    options:
      - Une accuracy minimale
      - Un rappel à atteindre sous une contrainte de précision
      - Une validation croisée à 30 plis
      - Une calibration à 30 %
    answer: [1]
    explanation: La métrique primaire est le rappel, tenu seulement si la précision ne tombe pas sous 30 %.

  - prompt: Pourquoi une métrique primaire se choisit-elle avant les essais ?
    options:
      - Pour pouvoir la changer dès qu'un modèle est faible sur une autre
      - Pour éviter de garder, après coup, l'indicateur qui flatte le modèle préféré
      - Parce que les bibliothèques n'en calculent qu'une
      - Pour supprimer le jeu de validation
    answer: [1]
    explanation: Choisir l'indicateur après avoir vu les scores, c'est du tri de résultats, pas une expérience.
