questions:
  - prompt: Quelle est la prévision naïve de demain ?
    options:
      - La moyenne de l'année prochaine
      - La valeur d'aujourd'hui
      - Un boosting à 400 arbres
      - Le MAPE d'hier
    answer: [1]
    explanation: La naïve recopie la dernière valeur observée. Elle est l'adversaire minimum.

  - prompt: Quelle est une baseline saisonnière hebdomadaire ?
    options:
      - Demain vaudra le même jour de la semaine dernière
      - Demain vaudra la moyenne de toutes les séries mélangées
      - Demain vaudra la cible du test
      - Demain vaudra zéro
    answer: [0]
    explanation: On recopie le motif déjà vu au même endroit de la saison, ici le même jour sept jours plus tôt.

  - prompt: "Naïve MAE 18, saisonnière 11, boosting 10,5, même horizon. Que retenez-vous ?"
    options:
      - Le boosting, car il gagne une demi-unité
      - La saisonnière, le gain du boosting ne paie pas sa complexité
      - La naïve, car elle est la plus connue
      - Les trois en moyenne
    answer: [1]
    explanation: On ne remplace pas une règle lisible pour un écart négligeable.

  - prompt: Pourquoi le MAPE est-il dangereux un jour où la vérité vaut 0 ?
    options:
      - Il vaut toujours 0
      - La division par zéro le rend indéfini ou absurde
      - Il devient égal au MAE
      - Il ignore les grandes séries
    answer: [1]
    explanation: Le pourcentage divise par la valeur réelle. À zéro, il n'a pas de sens.

  - prompt: "Vérité 2 000, prévision 1 900, et un autre jour vérité 2, prévision 4. Pourquoi le MAPE moyen trompe ?"
    options:
      - Les deux erreurs en pourcentage pèsent pareil alors que les volumes non
      - Le MAE est toujours en pourcentage
      - 100 unités et 2 unités sont identiques pour une commande
      - Le second jour a un MAPE nul
    answer: [0]
    explanation: 5 % de 2 000 et 100 % de 2 ne représentent pas le même enjeu. On reste en unités ou on pondère.

  - prompt: L'acheteur commande à J+21. Le rapport donne un MAE à J+1 de 4 unités. Usage correct ?
    options:
      - Commander en croyant que l'erreur à 21 jours vaut 4
      - Mesurer l'erreur à l'horizon 21 avant de décider
      - Allonger l'horizon sans mesurer
      - Remplacer le MAE par l'accuracy
    answer: [1]
    explanation: L'erreur grossit avec l'horizon. Le chiffre de J+1 ne décrit pas J+21.

  - prompt: À quoi sert une fourchette du type « 100 à 145 dans 80 % des semaines semblables » ?
    options:
      - À remplacer la baseline
      - À dire l'incertitude, et parfois à renoncer si la plage dépasse la marge logistique
      - À calculer un MAPE
      - À mélanger le futur dans l'entraînement
    answer: [1]
    explanation: Le point central sans plage cache le risque. Une plage trop large ne sert pas à commander.

  - prompt: Quand des lags dans un boosting suffisent-ils souvent ?
    options:
      - Jamais, il faut un réseau spécialisé
      - Sur une série courte dont la saison est nette
      - Uniquement si le MAPE est nul
      - Quand on prévoit 90 jours avec des données de 10 jours
    answer: [1]
    explanation: Les valeurs passées (hier, J-7) portent déjà le motif. Un modèle tabulaire peut suffire.

  - prompt: Pourquoi recalculer la naïve à chaque nouveau point ?
    options:
      - Elle se met à jour sans réentraînement et peut battre un modèle figé après un choc
      - Pour optimiser le test trente fois
      - Parce que le MAPE l'exige
      - Pour inclure J+3 dans la fenêtre
    answer: [0]
    explanation: La copie d'hier suit le choc tout de suite. Un modèle ancien peut décrocher.

  - prompt: Quelles baselines comparez-vous avant un modèle ? (plusieurs réponses)
    multiple: true
    options:
      - Demain égale aujourd'hui
      - Demain égale le même point de la saison passée
      - Demain égale la moyenne du test
      - La règle déjà utilisée par la logistique, si elle existe
    answer: [0, 1, 3]
    explanation: Naïve, saisonnière et règle en place sont des adversaires. La moyenne du test n'est pas une baseline licite.

  - prompt: Quelles précautions concernent le MAPE ? (plusieurs réponses)
    multiple: true
    options:
      - Éviter les vérités nulles ou presque nulles
      - Ne pas moyenner de la même façon un petit magasin et un gros
      - Le préférer au MAE dans tous les cas
      - Dire explicitement s'il est calculé au-dessus d'un plancher
    answer: [0, 1, 3]
    explanation: Zéros, volumes disparates et transparence du plancher. Le MAE est souvent plus sûr, pas l'inverse.

  - prompt: Que signifie « même horizon » dans la comparaison baseline contre modèle ?
    options:
      - Les deux sont jugés à J+1 même si la décision est à J+21
      - Les deux erreurs sont calculées à l'horizon de la décision
      - L'un sur le train, l'autre sur le test
      - L'un en MAPE, l'autre en accuracy
    answer: [1]
    explanation: Sinon le modèle peut gagner à un horizon que personne n'utilise.

  - prompt: La fourchette est plus large que le stock de sécurité. Conclusion ?
    options:
      - Commander le centre de la fourchette sans le dire
      - Le chiffre ne distingue pas les scénarios utiles. On le dit, on ne feint pas la précision
      - Passer au MAPE pour rétrécir la fourchette
      - Mélanger les jours du test
    answer: [1]
    explanation: Une prévision moins précise que la marge d'action n'aide pas la commande. L'honnêteté évite une fausse exactitude.
