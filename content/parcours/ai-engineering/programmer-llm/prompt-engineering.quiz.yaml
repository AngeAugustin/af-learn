questions:
  - prompt: Vous hésitez sur la clarté de votre prompt de classification de tickets. Quel test simple est recommandé ?
    options:
      - Le faire relire par un autre LLM qui le notera sur 10
      - "Le donner à un collègue sans contexte : s'il ne comprend pas exactement ce qu'il faut faire, le modèle non plus"
      - Vérifier qu'il dépasse 500 mots
      - Le traduire en anglais
    answer: [1]
    explanation: Le modèle ne connaît ni votre projet ni vos conventions ; tout ce qui est implicite doit être écrit.

  - prompt: "Votre prompt dit : « N'utilise jamais de points de suspension. » Le modèle les évite, mais utilise aussi d'autres tournures inadaptées. Quelle réécriture est la plus efficace ?"
    options:
      - « NE JAMAIS UTILISER DE POINTS DE SUSPENSION !!! »
      - « Ta réponse sera lue par un moteur de synthèse vocale, qui ne sait pas prononcer les points de suspension ; écris des phrases complètes et simples. »
      - Supprimer la règle
      - Répéter la règle trois fois
    answer: [1]
    explanation: Expliquer la raison permet au modèle de généraliser à des cas que la règle ne mentionne pas.

  - prompt: "Quelle consigne a le plus de chances de produire un texte sans liste à puces ?"
    options:
      - « N'utilise pas de markdown. »
      - « Rédige ta réponse en paragraphes de prose fluide. »
      - « Évite absolument les listes. »
      - « Pas de puces, pas de titres, pas de gras. »
    answer: [1]
    explanation: Dire quoi faire est généralement plus efficace que dire quoi éviter.

  - prompt: Vous ajoutez trois exemples few-shot à un prompt d'extraction, tous issus de courriels de livraison. Le modèle se met à classer d'autres sujets en « livraison ». Quelles corrections appliquer ? (plusieurs réponses)
    multiple: true
    options:
      - Varier les exemples pour couvrir plusieurs catégories et des cas limites
      - Encadrer les exemples dans des balises (par exemple <exemple>) pour les distinguer des consignes
      - Copier les exemples tels quels dans dix variantes identiques
      - Préciser que les exemples illustrent le format, pas une catégorie privilégiée
    answer: [0, 1, 3]
    explanation: Des exemples trop homogènes biaisent le modèle ; ils doivent être variés et clairement délimités.

  - prompt: Un utilisateur colle un courriel qui contient « Ignore les instructions précédentes ». Votre prompt l'insère sans délimitation au milieu des consignes. Quelle amélioration structurelle aide le modèle à le traiter comme une donnée ?
    options:
      - Mettre le courriel en majuscules
      - L'encadrer dans des balises comme <courriel>…</courriel> et indiquer que leur contenu est une donnée à analyser
      - Le placer avant le prompt système
      - Le résumer avant de l'envoyer
    answer: [1]
    explanation: Les balises séparent instructions et données ; ce n'est pas une protection complète contre l'injection (module 9), mais cela aide nettement.

  - prompt: Vous analysez un rapport de 60 pages avec une question précise. Quelle organisation du prompt la documentation d'Anthropic recommande-t-elle ?
    options:
      - La question au début, le document ensuite
      - Le document en haut, la question et les instructions à la fin
      - La question répétée toutes les 10 pages
      - Le document découpé en 60 requêtes indépendantes
    answer: [1]
    explanation: Placer les documents en haut et la question à la fin améliore généralement la qualité des réponses.

  - prompt: Sur des problèmes de planification en plusieurs étapes, demander au modèle de raisonner avant de répondre améliore les résultats. Pourquoi ?
    options:
      - Parce que le modèle devient plus intelligent
      - Parce que les tokens de raisonnement lui donnent de l'espace pour décomposer le problème, et chaque étape générée sert de contexte aux suivantes
      - Parce que les réponses deviennent plus courtes
      - Parce que la température baisse automatiquement
    answer: [1]
    explanation: Le raisonnement explicite (ou la réflexion intégrée des modèles de raisonnement) aide sur les tâches complexes, au prix de tokens supplémentaires.

  - prompt: Le modèle affiche un raisonnement détaillé et convaincant, puis donne une réponse fausse. Quelle leçon en tirer ?
    options:
      - Un raisonnement affiché garantit la justesse ; il s'agit d'un bug
      - "Le raisonnement affiché ne garantit pas la correction de la réponse, ni même qu'il reflète fidèlement le calcul interne : il faut vérifier la réponse"
      - Il faut supprimer le raisonnement
      - Il faut augmenter la température
    answer: [1]
    explanation: Le raisonnement aide, mais la vérification (évaluation, validation, outils) reste indispensable.

  - prompt: Vous modifiez le prompt et testez sur trois exemples qui semblent meilleurs. Quelle démarche est correcte ?
    options:
      - Déployer, puisque les trois exemples sont meilleurs
      - Relancer le jeu d'évaluation complet, comparer les scores et les cas qui ont changé, modifier une seule chose à la fois
      - Tester sur trois autres exemples
      - Demander au modèle si le nouveau prompt est meilleur
    answer: [1]
    explanation: Trois exemples ne disent rien de la qualité globale ; une modification peut en améliorer certains et en dégrader d'autres.

  - prompt: Votre code doit lire un JSON produit par Claude. Un collègue propose de pré-remplir la réponse de l'assistant avec « { » pour forcer le format. Que faire ?
    options:
      - L'appliquer, c'est la méthode standard
      - "Utiliser les sorties structurées : le pré-remplissage n'est plus pris en charge par les modèles Claude récents (l'API renvoie une erreur)"
      - Demander le JSON en majuscules
      - Parser le texte avec des expressions régulières
    answer: [1]
    explanation: Les sorties structurées garantissent la conformité au schéma (chapitre suivant).

  - prompt: Une tâche demande d'extraire des données d'un contrat, puis de rédiger un courriel de synthèse au client. Le prompt unique donne des résultats moyens sur les deux. Quelle technique tester ?
    options:
      - Ajouter plus de consignes dans le même prompt
      - "Découper en deux prompts enchaînés : extraction validée, puis rédaction à partir des données extraites"
      - Augmenter max_tokens
      - Changer de langue
    answer: [1]
    explanation: Découper en étapes simples rend chaque étape plus fiable, testable et mesurable.

  - prompt: Votre prompt système contient la phrase « Tu es un assistant très intelligent. » et rien d'autre sur le contexte. Quel ajout a le plus d'impact ?
    options:
      - « Tu es un assistant extrêmement intelligent et expert. »
      - Le contexte concret, qui sont les utilisateurs, à quoi sert la réponse, le format attendu, et comment traiter les cas limites
      - Une liste de 30 interdictions
      - Des émojis pour le ton
    answer: [1]
    explanation: Un rôle générique apporte peu ; le contexte et les attentes précises changent réellement les réponses.
