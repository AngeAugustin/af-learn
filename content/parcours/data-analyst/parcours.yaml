slug: data-analyst
title: Data Analyst
tagline: Transformer une question métier en analyse fiable, visualisée et actionnable.
description: >-
  Un parcours complet et orienté pratique pour devenir Data Analyst : cadrage d'une question,
  tableurs, SQL analytique, Python (pandas et Polars), statistiques pour décider, visualisation
  et storytelling, indicateurs produit, funnel et cohortes, tests A/B, restitution en tableaux
  de bord et en notes de décision, qualité des données et collaboration avec les équipes data.
  Chaque chapitre se termine par des exercices et une évaluation à valider avec au moins 75 %.
level: Débutant à avancé
domain: Data
skills:
  - SQL
  - Python
  - Statistiques
  - Visualisation
  - Storytelling
color: amber
icon: chart
order: 5
status: published
prerequisites:
  - Être à l'aise avec un tableur (Excel ou Google Sheets)
  - Notions de pourcentages, moyennes et lecture de graphiques
  - Aucune connaissance préalable en SQL ou en Python n'est requise
outcomes:
  - Cadrer une question métier et choisir la métrique qui y répond vraiment
  - Écrire du SQL analytique (jointures, agrégations, fenêtres, CTE)
  - Nettoyer, transformer et automatiser des analyses en Python
  - Interpréter des statistiques descriptives, des intervalles et des tests
  - Construire des visualisations et un récit qui font décider
  - Concevoir un test A/B et repérer les biais d'une analyse
  - Livrer un tableau de bord ou une note de décision actionnable
  - Collaborer avec les Data Engineers et respecter la qualité et le RGPD
