modules:
  - slug: fondations
    title: Fondations du Data Analyst
    description: Le métier, la pensée analytique et la maîtrise professionnelle du tableur.
    chapters: [metier-data-analyst, pensee-analytique-cadrage, excel-sheets-pro]
  - slug: sql
    title: SQL pour l'analyse
    description: Interroger une base pour répondre à une question métier, des jointures aux fenêtres, jusqu'à la qualité des requêtes.
    chapters: [sql-fondamentaux-analyste, jointures-agregations, fenetres-ctes-sous-requetes, qualite-requetes-perf]
  - slug: python
    title: Python pour l'analyse
    description: Passer du tableur à pandas et Polars, nettoyer les données et automatiser une analyse reproductible.
    chapters: [python-donnees, pandas-polars, nettoyage-transformation, automatiser-analyses]
  - slug: statistiques
    title: Statistiques pour décider
    description: Décrire, quantifier l'incertitude et relier des variables sans confondre corrélation et décision.
    chapters: [stats-descriptives, probabilites-distributions, inference-intervalles-tests, correlations-regression-simple]
  - slug: visualisation
    title: Visualisation et storytelling
    description: Choisir le bon graphique, éviter les pièges visuels et raconter une analyse qui fait agir.
    chapters: [principes-dataviz, graphiques-efficaces, storytelling-data]
  - slug: analyse-metier
    title: Analyse métier et domaines
    description: Indicateurs produit, funnel, rétention, cohortes, et lectures finance, marketing et opérations.
    chapters: [kpis-metriques-produit, analyse-funnel-retention, finance-marketing-ops, segmentation-cohortes]
  - slug: experimentation
    title: Expérimentation et causalité
    description: Tester une hypothèse, éviter les biais classiques et introduire le raisonnement causal.
    chapters: [ab-testing, biais-pieges-analyse, introduction-causalite]
  - slug: restitution
    title: Outils BI et restitution
    description: Premiers pas dans un outil BI, tableaux de bord actionnables, notes et slides pour les décideurs.
    chapters: [power-bi-tableau-bases, dashboards-actionnables, notes-slides-stakeholders]
  - slug: qualite-collaboration
    title: Qualité, éthique et collaboration
    description: Fiabiliser une analyse, respecter les personnes derrière les données, travailler avec l'ingénierie data.
    chapters: [qualite-donnees-analyste, ethique-rgpd-analyse, travailler-avec-data-eng]
  - slug: projet
    title: Du brief au livrable
    description: Conduire une analyse de bout en bout, critiquer le travail d'autrui, puis réaliser le projet final.
    chapters: [brief-au-livrable, revue-critique-analyses, projet-final]
