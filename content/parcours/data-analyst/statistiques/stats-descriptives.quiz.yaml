questions:
  - prompt: "Dix commandes totalisent 921 €. À quoi sert la moyenne de 92,1 € ?"
    options:
      - "À décrire la commande ordinaire, insensible au montant le plus élevé"
      - "À retrouver le total, parce que moyenne × effectif = somme"
      - "À couper la série en quatre quarts égaux"
      - "À mesurer la marge d'erreur du sondage"
    answer: [1]
    explanation: "La moyenne conserve le total. La médiane décrit plutôt le milieu. L'écart-type n'est pas une marge d'erreur."

  - prompt: "Les paniers triés vont de 24 € à 44 €, plus une commande B2B à 620 €. Quel indicateur décrit le mieux une commande ordinaire ?"
    options:
      - "La moyenne, justement parce qu'elle vaut 92,1 €"
      - "La médiane, qui reste au milieu de la série triée"
      - "Le maximum, parce que c'est le client à viser"
      - "L'écart-type, lu comme une fourchette autour de la moyenne"
    answer: [1]
    explanation: "La médiane ne bouge pas si la commande B2B devient encore plus grosse. La moyenne, si. L'écart-type est ici gonflé par ce seul montant."

  - prompt: "statistics.stdev et ECARTYPE.STANDARD d'Excel divisent par n − 1. Quelle précaution en réunion ?"
    options:
      - "Aucune, toutes les fonctions d'écart-type du marché donnent le même nombre à l'euro près, toujours"
      - "Citer la fonction utilisée, et ne pas la mélanger avec l'écart-type qui divise par n"
      - "Diviser ensuite le résultat par la médiane pour obtenir un pourcentage de CA"
      - "Remplacer l'écart-type par le maximum"
    answer: [1]
    explanation: "Sur un petit effectif, stdev et pstdev diffèrent déjà (185,6 € contre 176,1 € dans l'exemple du cours). On ne change pas de définition entre deux slides."

  - prompt: "Q1 = 20 €, médiane = 28 €, Q3 = 40 € sur une série de paniers. Quelle lecture est correcte ?"
    options:
      - "75 % des commandes valent exactement 40 €"
      - "Environ un quart des commandes est au niveau de Q1 ou en dessous, un quart au niveau de Q3 ou au-dessus"
      - "La moyenne vaut forcément 28 €"
      - "L'écart Q3 − Q1 est une probabilité"
    answer: [1]
    explanation: "Les quartiles partagent la série triée en quatre paquets d'effectifs comparables. Ils ne disent ni la moyenne ni une probabilité."

  - prompt: "Pourquoi moyenne et médiane s'éloignent-elles souvent sur des paniers e-commerce ?"
    options:
      - "Parce que la distribution est souvent décalée, avec une traîne de gros paniers qui tire la moyenne"
      - "Parce que la médiane n'est définie que pour les dates"
      - "Parce que pandas refuse les montants positifs"
      - "Parce que l'écart-type est toujours nul"
    answer: [0]
    explanation: "Une traîne à droite déplace la moyenne au-dessus de la médiane. Deux populations mélangées (web et B2B) demandent en plus d'être séparées."

  - prompt: "Le canal e-mail fait 310 commandes sur 1 240, et 40 % du CA. Quelles formulations sont acceptables ? (plusieurs réponses)"
    multiple: true
    options:
      - "25 % des commandes (310 sur 1 240)"
      - "40 % du chiffre d'affaires"
      - "25 % du CA, puisque 310 / 1 240 = 25 %"
      - "Une part des commandes et une part du CA, citées séparément"
    answer: [0, 1, 3]
    explanation: "25 % est une part des commandes, pas du CA. Le canal pèse plus lourd en argent (40 %) qu'en nombre de commandes."

  - prompt: "Les commandes d'un canal passent de 200 à 250. Quelle est l'évolution en pourcentage ?"
    options:
      - "+50 %, parce que l'effectif a augmenté de 50"
      - "+25 %, soit (250 − 200) / 200"
      - "+250 %, parce que la nouvelle valeur est 250"
      - "25 % du CA total de l'entreprise"
    answer: [1]
    explanation: "L'évolution divise l'écart par la base de départ. +50 commandes n'est pas +50 %. On donne aussi l'effectif pour ne pas sur-réagir à un petit canal."

  - prompt: "Semaine 1 : 5 achats sur 10 visites. Semaine 2 : 200 achats sur 10 000 visites. Pourquoi la moyenne des deux taux (26 %) est-elle trompeuse ?"
    options:
      - "Elle oublie de multiplier par l'écart-type"
      - "Elle donne le même poids aux deux semaines, alors que la seconde a mille fois plus de visites. Le taux global est d'environ 2 %"
      - "Un taux ne se calcule jamais avec des effectifs"
      - "La médiane des deux taux vaudrait 2 %"
    answer: [1]
    explanation: "205 / 10 010 ≈ 2 %. Moyenne des pourcentages sans pondérer par la base fait peser une petite semaine autant qu'une grande."

  - prompt: "Dans l'exemple des accroches A et B, A est meilleure sur mobile et sur ordinateur, B est meilleure au global. Comment est-ce possible ?"
    options:
      - "Les taux par appareil ont été mal additionnés"
      - "Les mix d'appareils diffèrent : B a été surtout vue là où le taux est haut pour tout le monde"
      - "La médiane interdit ce genre de tableau"
      - "Un taux global est toujours l'inverse de chaque segment"
    answer: [1]
    explanation: "C'est le paradoxe de Simpson. Le total et le détail répondent à des questions différentes quand la composition des groupes n'est pas la même."

  - prompt: "Que ne dit pas le paradoxe de Simpson ? (plusieurs réponses)"
    multiple: true
    options:
      - "Le total est forcément une erreur de calcul"
      - "Il faut jeter le taux global dans tous les rapports"
      - "Le total et les segments peuvent désigner des gagnants différents si les mix diffèrent"
      - "Il faut nommer la question (à segment égal, ou plan média tel qu'acheté) avant de choisir"
    answer: [0, 1]
    explanation: "Les deux lectures peuvent être justes pour deux questions. Simpson demande d'expliciter le mélange, pas d'interdire le total."

  - prompt: "Une cellule affiche 90 % de conversion. Quelle information manque pour la prendre au sérieux ?"
    options:
      - "La couleur du graphique"
      - "L'effectif (90 % de 100 visites n'a pas le même poids que 90 % de 100 000)"
      - "L'écart-type de la médiane des quartiles"
      - "Le mot « moyenne » dans le titre, obligatoire"
    answer: [1]
    explanation: "Un pourcentage sans base voyage mal. 90 achats sur 100 visites et 9 achats sur 10 visites sont le même taux, pas la même preuve."

  - prompt: "Deux bosses dans l'histogramme des paniers (petites commandes web et commandes B2B) vous incitent à :"
    options:
      - "Publier une seule moyenne pour les deux populations"
      - "Séparer les populations et décrire chacune"
      - "Remplacer tous les montants par la médiane globale"
      - "Conclure que l'écart-type est une probabilité de 50 %"
    answer: [1]
    explanation: "Une moyenne unique écrase deux métiers différents. On décrit chaque bosse, puis on dit le poids de chacune dans le CA."

  - prompt: "Décrire le mois de mars avec une médiane juste prouve-t-il que avril sera identique ?"
    options:
      - "Oui, la médiane est une prévision"
      - "Non, la description dit ce qui s'est passé dans cet extrait. L'incertitude sur une autre période est un autre sujet"
      - "Oui, si l'écart-type est inférieur à la moyenne"
      - "Non, sauf si le pourcentage n'a pas de dénominateur"
    answer: [1]
    explanation: "Le descriptif ne généralise pas tout seul. Un bon résumé reste indispensable : un intervalle autour d'une mauvaise définition ne répare pas la définition."
