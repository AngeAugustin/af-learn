questions:
  - prompt: "Que représente, dans le schéma du chapitre, une ligne de la table commandes tant que vous ne joignez rien ?"
    options:
      - Un client, même s'il n'a jamais commandé
      - Une commande
      - Un article de la commande
      - Un jour de vente
    answer: [1]
    explanation: Le grain est une commande. Compter les lignes compte des commandes, pas des clients ni des articles.

  - prompt: "Pourquoi éviter SELECT * dans une requête que d'autres reliront ?"
    options:
      - Parce que l'étoile est une erreur de syntaxe
      - Parce qu'une colonne ajoutée change l'export, et que vous emportez des champs dont vous n'avez pas besoin
      - Parce que WHERE devient impossible
      - Parce que les alias sont interdits avec une liste de colonnes
    answer: [1]
    explanation: SELECT * convient à un coup d'œil. Une requête durable nomme les colonnes de la question, rien de plus.

  - prompt: "Quelle écriture couvre tout mars 2026 sans inclure le 1er avril ?"
    options:
      - passee_le = 'mars'
      - passee_le BETWEEN le 1er mars et le 1er avril, bornes incluses, sur un horodatage
      - passee_le >= 1er mars 2026 et passee_le < 1er avril 2026
      - LIMIT 31
    answer: [2]
    explanation: L'intervalle semi-ouvert, début inclus et fin exclue, évite de perdre ou de doubler des instants en bord de mois.

  - prompt: "Pourquoi statut <> 'annulee' est-il un mauvais filtre pour les ventes ?"
    multiple: true
    options:
      - Une commande remboursée resterait dans le résultat
      - Un nouveau statut imprévu, comme en_attente, resterait aussi
      - Les commandes payées seraient toutes exclues
      - Le filtre ne dit pas quels statuts vous considérez comme une vente
    answer: [0, 1, 3]
    explanation: Exclure seulement l'annulé laisse passer remboursements et statuts inconnus. Il faut lister les statuts gardés, par exemple payee et expediee.

  - prompt: "Un collègue titre « top 10 de mars » une requête avec LIMIT 10 et sans ORDER BY. Qu'a-t-il obtenu ?"
    options:
      - Les dix plus gros montants, car la base trie toujours par montant
      - Dix lignes dans un ordre non garanti, pas un classement
      - Exactement les dix premières commandes du mois, par date
      - Une erreur, car LIMIT est interdit sans GROUP BY
    answer: [1]
    explanation: Sans ORDER BY, aucun ordre n'est promis. LIMIT plafonne un extrait. Le sens du top vient du tri, le mois vient du WHERE.

  - prompt: "Pourquoi WHERE montant_ttc > 100 échoue-t-il si montant_ttc est un alias du SELECT ?"
    options:
      - Parce que la multiplication est interdite
      - Parce que WHERE est évalué avant SELECT, donc l'alias n'existe pas encore
      - Parce qu'il manque un DISTINCT
      - Parce que les alias n'acceptent que des lettres majuscules
    answer: [1]
    explanation: L'alias est créé au SELECT. On répète l'expression dans le WHERE, ou on passe par une sous-requête. ORDER BY, lui, peut utiliser l'alias.

  - prompt: "Sur 1 000 clients dont 50 ont pays NULL et 150 un pays autre que FR, que renvoie WHERE pays <> 'FR' ?"
    options:
      - 200 lignes, France exclue et NULL inclus
      - 150 lignes, les NULL disparaissent car la comparaison n'est pas vraie
      - 50 lignes, seulement les NULL
      - 0 ligne, car FR est un texte
    answer: [1]
    explanation: NULL <> 'FR' est inconnu, pas vrai. WHERE ne garde pas ces lignes. Il faut OR pays IS NULL ou IS DISTINCT FROM.

  - prompt: "Quelles affirmations sur NULL sont exactes ?"
    multiple: true
    options:
      - NULL signifie inconnu, pas zéro et pas chaîne vide
      - WHERE pays = NULL ne renvoie pas les pays manquants
      - COALESCE(pays, 'Inconnu') remplace le besoin d'un filtre IS NULL
      - pays <> 'FR' n'inclut pas les pays NULL
    answer: [0, 1, 3]
    explanation: COALESCE change l'affichage, pas un filtre déjà faux. Seul IS NULL (ou une écriture équivalente) teste l'inconnu.

  - prompt: "À quoi sert SELECT DISTINCT pays FROM clients ?"
    options:
      - À compter les clients
      - À lister les valeurs de pays présentes, une fois chacune
      - À supprimer les clients sans commande dans la base
      - À corriger une jointure qui a multiplié les lignes
    answer: [1]
    explanation: DISTINCT dédoublonne le résultat affiché. Il ne compte pas, il ne modifie pas la table, et il ne doit pas masquer un grain cassé.

  - prompt: "Quel défaut porte un alias ca_net posé sur un montant brut, sans filtre de remboursement ?"
    options:
      - Aucun, le nom n'est que décoratif
      - Le nom ment, et il sera repris tel quel dans une slide
      - L'alias ralentit forcément la requête
      - Un alias de colonne est interdit sur un numeric
    answer: [1]
    explanation: Un alias honnête décrit le calcul réel. ca_net pour un brut non filtré fait dire à l'entreprise un chiffre qu'elle n'a pas.

  - prompt: "Quels éléments de cette requête correspondent bien à « vingt plus gros montants HT payés en janvier 2026 » ?"
    multiple: true
    options:
      - Un WHERE sur le statut payee et sur l'intervalle de janvier, début inclus et fin exclue
      - ORDER BY montant_ht DESC puis un identifiant pour départager
      - LIMIT 20 après ce tri
      - LIMIT 20 sans ORDER BY, avec statut <> 'annulee'
    answer: [0, 1, 2]
    explanation: Le mois et le statut se filtrent, le sens du top se trie, le plafond vient en dernier. Un LIMIT sans tri ni liste de statuts ne répond pas à la phrase.

  - prompt: "Quelle est votre place face à la base, dans ce chapitre ?"
    options:
      - Corriger les commandes fausses par un UPDATE
      - Créer les index et les utilisateurs
      - Interroger des tables maintenues par d'autres, sans réécrire les lignes
      - Vider la table avant chaque analyse
    answer: [2]
    explanation: L'analyste lit. Modifier la production ou administrer les droits n'est pas le geste de l'analyse.

  - prompt: "Que faites-vous d'un OR collé à un AND dont vous ne savez plus le sens ?"
    options:
      - Vous le laissez, la base parenthèse toujours comme le métier
      - Vous parenthésez et vous relisez la condition comme une phrase
      - Vous remplacez le tout par SELECT DISTINCT
      - Vous retirez le filtre de dates pour simplifier
    answer: [1]
    explanation: Un OR mal groupé avec un AND change le périmètre en silence. La phrase métier et les parenthèses doivent dire la même chose.
