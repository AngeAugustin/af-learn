questions:
  - prompt: Dans quel ordre relisez-vous une note ?
    options:
      - Recommandation d'abord, le reste seulement si vous êtes d'accord
      - Question, définition, grain, biais, graphique, puis recommandation
      - Graphique d'abord, car il résume tout
      - Nombre de slides, puis le fond
    answer: [1]
    explanation: Une case cassée n'est pas sauvée par les suivantes. L'ordre empêche d'être impressionné par un pourcentage écrit gros.

  - prompt: « La conversion est de 2 % sur mobile » sans autre précision pèche d'abord par…
    options:
      - La couleur du camembert
      - L'absence de numérateur, de dénominateur et de fenêtre
      - Un excès de limites
      - Un test A/B trop long
    answer: [1]
    explanation: Sans définition, le chiffre ne se refait pas. La note peut être sûre d'elle et quand même illisible.

  - prompt: Un camembert « 70 % des sessions sont mobiles » ne montre pas…
    options:
      - Une part de sessions
      - L'écart de taux de commande, ni un effet causal de l'application, ni février contre mars à jours comparables
      - Que le mobile pèse lourd dans le trafic mesuré en sessions
      - Le besoin éventuel d'aller voir le tunnel
    answer: [1]
    explanation: Le graphique se relit comme une phrase. Celui-ci dit « le mobile est gros », pas « l'application détruit la conversion ».

  - prompt: Pourquoi « les utilisateurs mobiles ont une seule commande, donc l'application attire un mauvais public » est fragile ?
    options:
      - Parce que les nouveaux ont par définition peu de commandes derrière eux
      - Parce que 1 est un trop petit nombre pour un tableur
      - Parce que le parrainage est en cause
      - Parce que la finance a un autre TVA
    answer: [0]
    explanation: Ancienneté et qualité sont confondues. Le public n'a pas été tiré au sort entre mobile et ordinateur.

  - prompt: L'auteur a retiré la semaine du Black Friday et isolé la région Sud « encore pire ». Vous y voyez…
    options:
      - Une métrique primaire figée avant
      - Un tri après coup
      - Un rapprochement de clés
      - Une unité de randomisation
    answer: [1]
    explanation: Les découpes choisies parce qu'elles accentuent la baisse ne font pas partie de la conclusion, ou alors elles sont étiquetées exploratoires.

  - prompt: Février contre mars, sans aligner les jours ni isoler d'autre cause, sert à…
    options:
      - Prouver que l'application a baissé le chiffre d'affaires
      - Rien de décisionnel en l'état, le calendrier suffit à brouiller la comparaison
      - Calculer un taux de sessions
      - Remplacer le funnel
    answer: [1]
    explanation: Longueur de mois, campagne et saison se mélangent au lancement. La comparaison n'est pas exploitable telle quelle.

  - prompt: Une fois la demande de dépublication retirée, que peut-on encore écrire si les taux se confirment ?
    options:
      - Le mobile est cassé et convertit trois fois moins, cause comprise
      - Un écart de taux annoncé entre devices, définition à confirmer, qui justifie d'ouvrir le tunnel, pas de le déclarer cassé
      - Il faut couper l'acquisition mobile
      - L'application sera retirée à l'été
    answer: [1]
    explanation: On garde le signal. On retire la cause non démontrée et le ratio dramatique tant que les populations diffèrent.

  - prompt: "Quelles objections factuelles envoyez-vous à l'auteur de la note mobile ? (plusieurs réponses)"
    multiple: true
    options:
      - La décision « retirer l'application » n'est pas celle que compare un écart de devices au même mois
      - Sessions, clients et euros sont mélangés
      - Le camembert ne montre pas le 2 % contre le 6 %
      - Le logo de l'application est mal placé
    answer: [0, 1, 2]
    explanation: La relecture reste factuelle. Le goût graphique du logo n'est pas une case de la grille.

  - prompt: "Que conservez-vous après avoir démonté la note ? (plusieurs réponses)"
    multiple: true
    options:
      - Le besoin de redéfinir le taux avec des volumes
      - La priorité éventuelle d'inspecter le tunnel mobile si le poids de sessions se confirme
      - La preuve que l'application cause la baisse de février
      - Le retrait immédiat des stores
    answer: [0, 1]
    explanation: Démonter n'est pas tout jeter. Le signal d'inspection reste. La cause et la fermeture sortent.

  - prompt: Le funnel propre montre 40 % d'abandon au paiement mobile contre 15 % sur ordinateur, surtout sur un navigateur. Quel geste est proportionné ?
    options:
      - Refondre tout le site et couper l'acquisition mobile
      - Corriger ce paiement, mesurer l'échec avant et après, laisser l'application en ligne
      - Dépublier avant l'été
      - Annoncer un gain de chiffre d'affaires déjà acquis
    answer: [1]
    explanation: Le geste suit la localisation. Une étape et un navigateur ne portent ni une refonte ni une fermeture.

  - prompt: Comparer un taux de sessions mobiles à un taux d'utilisateurs desktop pèche par…
    options:
      - Le grain, l'unité change en cours de phrase
      - La fraîcheur seule
      - L'absence de logo
      - Un excès de gardes-fous
    answer: [0]
    explanation: On n'additionne pas des unités différentes. « Globalement » ne crée pas un dénominateur commun.

  - prompt: « Belle piste, définition à figer, pas de décision cette semaine » est…
    options:
      - Un échec de relecture
      - Une revue honorable quand le signal existe et que la note n'est pas actionnable en l'état
      - Une façon de tout accepter
      - Un cherry-picking
    answer: [1]
    explanation: Tout n'est pas à jeter, tout n'est pas à voter. La grille peut conclure à « pas encore ».

  - prompt: Le verbe de la recommandation doit pouvoir…
    options:
      - Être plus grand que le tableau, pour emporter la décision
      - Se recopier sous le tableau sans enfler le périmètre mesuré
      - Éviter tout chiffre
      - Contredire la définition pour aller plus vite
    answer: [1]
    explanation: La proportion se juge à la fin. Un écart de tunnel justifie un correctif, pas une fermeture de l'application.
