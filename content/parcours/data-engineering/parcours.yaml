slug: data-engineering
title: Data Engineering
tagline: Concevoir des pipelines de données fiables, de l'ingestion à l'entrepôt et au temps réel.
description: >-
  Un parcours complet et orienté pratique pour devenir Data Engineer : SQL avancé, modélisation
  (étoile, Data Vault), formats et architectures de stockage (data lake, entrepôt, lakehouse, NoSQL),
  transformation avec dbt, DuckDB, Trino et Spark, orchestration, streaming et CDC avec Kafka,
  qualité, gouvernance et organisation, mise à disposition (BI, couche sémantique, API, données pour
  l'IA), conception d'architecture et mise en production. Chaque chapitre se termine par des exercices
  et une évaluation à valider avec au moins 75 %.
level: Débutant à avancé
domain: Data
skills:
  - SQL avancé
  - dbt
  - Orchestration
  - Streaming
  - Entrepôts de données
color: teal
icon: database
order: 2
status: published
prerequisites:
  - Savoir programmer dans au moins un langage (idéalement Python)
  - Être à l'aise avec la ligne de commande
  - Aucune connaissance préalable en SQL n'est requise
outcomes:
  - Écrire du SQL avancé et optimiser des requêtes analytiques
  - Modéliser des données relationnelles, dimensionnelles et en Data Vault
  - Choisir une architecture de stockage, une base et des formats adaptés (Parquet, Iceberg, Delta Lake, NoSQL)
  - Construire des pipelines batch idempotents avec dbt, DuckDB, Spark et un orchestrateur
  - Traiter des flux d'événements et des changements de bases avec Kafka et Debezium
  - Garantir la qualité, la sécurité et la conformité des données en production
  - Servir les données aux analystes, aux applications et aux équipes de machine learning et d'IA
  - Concevoir et argumenter une architecture de données chiffrée
