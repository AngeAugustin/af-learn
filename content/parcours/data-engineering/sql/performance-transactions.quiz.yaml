questions:
  - prompt: Vous voulez comprendre pourquoi une requête de lecture est lente, avec les temps et nombres de lignes réels. Quelle commande utiliser ?
    options:
      - EXPLAIN, qui affiche seulement le plan estimé
      - EXPLAIN ANALYZE, qui exécute la requête et affiche les mesures réelles
      - ANALYZE seul
      - VACUUM
    answer: [1]
    explanation: Comparer les lignes estimées et réelles révèle souvent des statistiques périmées.

  - prompt: Vous voulez analyser le plan d'un DELETE lent en production sans supprimer les lignes. Comment procéder ?
    options:
      - Lancer EXPLAIN ANALYZE directement
      - BEGIN ; EXPLAIN ANALYZE DELETE … ; ROLLBACK ;
      - Copier la table d'abord sur un portable
      - Ce n'est pas possible
    answer: [1]
    explanation: EXPLAIN ANALYZE exécute réellement la requête ; la transaction annulée évite l'effet.

  - prompt: Une requête qui garde 9 lignes affiche « Seq Scan … Rows Removed by Filter 48 000 000 ». Quelle action est la plus pertinente ?
    options:
      - Augmenter la mémoire du serveur
      - Créer un index adapté aux colonnes filtrées et vérifier avec EXPLAIN ANALYZE qu'il est utilisé
      - Supprimer la clause WHERE
      - Passer en SELECT *
    answer: [1]
    explanation: La table entière est parcourue pour quelques lignes ; un index permet d'aller directement aux bonnes lignes.

  - prompt: Un collègue veut indexer les 25 colonnes d'une table qui reçoit 5 000 insertions par seconde. Quel est le risque ?
    options:
      - Aucun, les index sont gratuits
      - Chaque index ralentit les écritures et occupe de l'espace ; on n'indexe que ce que les requêtes réelles utilisent
      - Les lectures deviennent plus lentes
      - La table devient en lecture seule
    answer: [1]
    explanation: Un index doit être mis à jour à chaque insertion ou modification.

  - prompt: Un index composite existe sur (client_id, passee_le). Une requête filtre uniquement sur passee_le. L'index est-il en général efficace ?
    options:
      - Oui, toujours
      - "Non, en général : la colonne de tête est client_id ; un index sur passee_le seul (ou en tête) conviendrait mieux"
      - Oui, si la table est petite
      - Seulement avec un ORDER BY
    answer: [1]
    explanation: Comme un annuaire trié par nom puis prénom, il sert mal une recherche par prénom seul.

  - prompt: Pourquoi « WHERE date_trunc('day', passee_le) = DATE '2026-03-02' » n'utilise-t-il pas un index ordinaire sur passee_le ?
    options:
      - Parce que date_trunc est interdit
      - Parce que la fonction est appliquée à la colonne ; il faut écrire un intervalle passee_le >= '2026-03-02' AND passee_le < '2026-03-03'
      - Parce que l'index est corrompu
      - Parce qu'il faut un index unique
    answer: [1]
    explanation: Une condition qui transforme la colonne empêche l'utilisation directe de l'index (sauf index sur expression).

  - prompt: Un virement débite le compte A, puis le serveur plante avant de créditer le compte B. Quelle propriété ACID garantit que le débit est annulé ?
    options:
      - La durabilité
      - "L'atomicité : tout ou rien"
      - L'isolation
      - La cohérence des index
    answer: [1]
    explanation: Les deux opérations dans une même transaction sont validées ensemble ou pas du tout.

  - prompt: Dans PostgreSQL au niveau par défaut, une longue transaction de rapport exécute deux SELECT successifs et obtient des totaux différents, car d'autres transactions ont validé entre-temps. Pourquoi ?
    options:
      - Un bug
      - "Le niveau par défaut est Read Committed : chaque requête voit les données validées à son propre démarrage ; Repeatable Read donnerait un instantané unique"
      - La transaction est corrompue
      - Les index sont obsolètes
    answer: [1]
    explanation: Pour un rapport cohérent sur plusieurs requêtes, on utilise Repeatable Read.

  - prompt: Un chargement de 20 millions de lignes par INSERT individuels prend 6 heures. Quelle approche est la plus efficace ?
    options:
      - Ajouter des index avant le chargement
      - Utiliser le chargement en masse (COPY) dans une table de staging, puis fusionner dans la table finale
      - Paralléliser 100 connexions qui font des INSERT
      - Désactiver les sauvegardes
    answer: [1]
    explanation: COPY évite le coût par requête et par aller-retour réseau.

  - prompt: Dans « INSERT … ON CONFLICT (id) DO UPDATE SET nom = EXCLUDED.nom », que désigne EXCLUDED ?
    options:
      - La ligne déjà présente dans la table
      - La ligne qu'on tentait d'insérer et qui est entrée en conflit
      - Les lignes supprimées
      - Une table temporaire à créer
    answer: [1]
    explanation: L'upsert met à jour la ligne existante avec les nouvelles valeurs.

  - prompt: Un pipeline relancé après un échec à mi-parcours a doublé les ventes du jour. Quelles techniques rendent ce chargement rejouable sans doublons ? (plusieurs réponses)
    multiple: true
    options:
      - Supprimer puis réinsérer la partition du jour dans une même transaction
      - Un upsert ou MERGE sur une clé unique
      - Ajouter une ligne de commentaire dans le script
      - Écrire dans une table de staging puis basculer de façon atomique
    answer: [0, 1, 3]
    explanation: Un chargement idempotent produit le même résultat quel que soit le nombre d'exécutions.

  - prompt: Le plan d'une requête estime 10 lignes mais en traite réellement 2 millions, et l'optimiseur a choisi une boucle imbriquée catastrophique. Que vérifier en premier ?
    options:
      - La version du système d'exploitation
      - Que les statistiques de la table sont à jour (ANALYZE), car l'optimiseur s'appuie sur elles
      - La couleur du terminal
      - Le nombre de colonnes
    answer: [1]
    explanation: Des statistiques périmées après un gros chargement trompent l'optimiseur.

  - prompt: Une requête fréquente lit seulement client_id, statut et montant avec un filtre sur client_id. Quelle optimisation permet de répondre depuis l'index seul ?
    options:
      - Un index couvrant sur client_id avec INCLUDE (statut, montant)
      - Un index sur montant
      - Supprimer la clé primaire
      - Passer la table en JSON
    answer: [0]
    explanation: Un parcours d'index seul (index-only scan) évite de lire la table.
