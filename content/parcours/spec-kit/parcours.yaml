slug: spec-kit
title: Utiliser GitHub Spec Kit
tagline: Le même flux de spécification dans Cursor, Claude Code, Codex et les autres agents.
description: >-
  Un parcours complet et orienté pratique pour mener une fonctionnalité avec GitHub Spec Kit :
  installation de specify, constitution, spécification, clarification, plan, tâches, checklist,
  analyse, implémentation et convergence. Le même dépôt se conduit dans Cursor, Claude Code
  et Codex, avec les permissions de chacun. Le fil rouge est Atelier Sève, le stage de
  céramique déjà réservable. Chaque chapitre se termine par des exercices et une évaluation
  à valider avec au moins 75 %.
level: Débutant à avancé
domain: Développement
skills:
  - Spec Kit
  - Cursor
  - Claude Code
  - Codex
  - Git
color: olive
icon: spec
order: 16
status: published
prerequisites:
  - Avoir déjà modifié un petit projet et utilisé Git
  - Savoir ouvrir un terminal
  - Aucune maîtrise préalable de Spec Kit n'est requise
outcomes:
  - Installer specify et préparer un dépôt pour un agent précis
  - Écrire une constitution et une spécification sans y mettre la pile technique
  - Clarifier, planifier, découper, puis contrôler la cohérence avant de coder
  - Lancer l'implémentation et converger jusqu'à ce que le code rejoigne la spec
  - Invoquer les mêmes skills dans Cursor, Claude Code et Codex
  - Refuser un workflow qui approuve des outils sans lecture
