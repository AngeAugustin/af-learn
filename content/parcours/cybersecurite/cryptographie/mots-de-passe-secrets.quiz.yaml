questions:
  - prompt: Vous concevez le stockage des mots de passe d'une nouvelle application. Quelle fonction choisir en premier ?
    options:
      - Argon2id
      - SHA-256
      - MD5
      - AES
    answer: [0]
    explanation: Fonction lente et coûteuse en mémoire, conçue pour les mots de passe.

  - prompt: Une base de mots de passe hachés en SHA-256 (avec sel) a fuité. Pourquoi est-ce grave ?
    options:
      - SHA-256 est réversible
      - Un hachage rapide permet à l'attaquant de tester des milliards de candidats par seconde
      - Le sel est visible
      - Ce n'est pas grave
    answer: [1]
    explanation: Les fonctions dédiées sont volontairement lentes.

  - prompt: Deux utilisateurs ont le même mot de passe, mais leurs empreintes stockées sont différentes. Pourquoi ?
    options:
      - Une erreur de la base
      - Grâce au sel, unique par utilisateur, qui rend aussi inutiles les tables précalculées
      - Grâce au chiffrement AES
      - Parce qu'ils se sont inscrits à des dates différentes
    answer: [1]
    explanation: Le sel n'est pas secret ; il est stocké avec l'empreinte.

  - prompt: Une application utilise bcrypt et accepte des phrases de passe de 200 caractères. Quelle limite faut-il connaître ?
    options:
      - bcrypt refuse les espaces
      - bcrypt ne prend en compte que les 72 premiers octets du mot de passe
      - bcrypt est réversible
      - bcrypt est trop rapide
    answer: [1]
    explanation: C'est une raison de préférer Argon2id pour un nouveau projet.

  - prompt: Quelles règles font partie d'une politique de mots de passe moderne ? (plusieurs réponses)
    multiple: true
    options:
      - Privilégier la longueur
      - Refuser les mots de passe connus ou ayant fuité
      - Autoriser les espaces et les longues phrases de passe
      - Imposer un changement tous les 30 jours
    answer: [0, 1, 2]
    explanation: Les changements périodiques forcés produisent des mots de passe prévisibles.

  - prompt: Quand faut-il imposer à un utilisateur un changement de mot de passe ?
    options:
      - Tous les mois
      - En cas de soupçon de compromission (fuite, hameçonnage)
      - Jamais
      - À chaque connexion
    answer: [1]
    explanation: Associé à la MFA, c'est bien plus efficace qu'un changement périodique.

  - prompt: Le mot de passe de la base de production est écrit dans le fichier settings.py versionné dans Git. Où devrait-il se trouver ?
    options:
      - Dans un commentaire du code
      - Dans un coffre-fort de secrets, injecté à l'exécution
      - Dans le README
      - Dans un fichier zip protégé
    answer: [1]
    explanation: Le code et son historique sont lus par beaucoup de personnes et d'outils.

  - prompt: La CI stocke une clé d'accès cloud permanente pour déployer. Quelle alternative est plus sûre ?
    options:
      - Une clé plus longue
      - "La fédération d'identité (OIDC) : la CI obtient des jetons temporaires sans clé stockée"
      - Partager la clé avec moins de personnes
      - La changer une fois par an
    answer: [1]
    explanation: Un jeton temporaire volé expire rapidement.

  - prompt: Une clé d'accès cloud vient d'être publiée par erreur sur un dépôt public. Quelle est la première action ?
    options:
      - Supprimer le commit
      - La révoquer immédiatement, puis analyser son utilisation éventuelle
      - Rendre le dépôt privé
      - Attendre de voir si quelqu'un l'utilise
    answer: [1]
    explanation: Des robots exploitent les clés publiées en quelques minutes ; l'historique Git les conserve.

  - prompt: Comment Have I Been Pwned vérifie-t-il qu'un mot de passe a fuité sans le recevoir ?
    options:
      - Il reçoit le mot de passe chiffré
      - On n'envoie que le début de son empreinte ; la comparaison se fait localement
      - Il ne le vérifie pas réellement
      - Il reçoit le mot de passe en clair via HTTPS
    answer: [1]
    explanation: C'est le principe du k-anonymat.

  - prompt: Quels outils détectent des secrets commités par erreur dans un dépôt de code ?
    options:
      - Des scanners de secrets comme gitleaks, en hook local et dans la CI
      - Un antivirus classique
      - Un pare-feu
      - Un compilateur
    answer: [0]
    explanation: Les plateformes de code proposent aussi une détection et un blocage des secrets à l'envoi.

  - prompt: Un salarié réutilise le même mot de passe pour sa messagerie professionnelle et un forum qui a fuité. Quelle attaque le menace, et quelles mesures la bloquent ?
    options:
      - "Le Kerberoasting : LAPS"
      - "Le bourrage d'identifiants (credential stuffing) : MFA et refus des mots de passe ayant fuité"
      - "L'injection SQL : requêtes paramétrées"
      - "Le XSS : CSP"
    answer: [1]
    explanation: Un gestionnaire de mots de passe permet des mots de passe uniques partout.

  - prompt: Les secrets d'une application doivent être changés régulièrement. Qu'est-ce qui facilite cette rotation ?
    options:
      - Les écrire dans le code pour les retrouver facilement
      - Un coffre-fort de secrets ou des identifiants dynamiques à durée de vie courte, sans redéploiement du code
      - Les partager par e-mail
      - Ne jamais les changer
    answer: [1]
    explanation: Moins un secret vit longtemps, moins sa fuite est grave.
