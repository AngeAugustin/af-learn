modules:
  - slug: fondamentaux
    title: Fondamentaux de la cybersécurité
    description: Menaces, métiers et cadre légal, principes de conception sécurisée, gestion des risques et référentiels.
    chapters: [metiers-cadre-legal, principes-securite, gestion-risques]
  - slug: systemes-reseaux
    title: Réseaux et systèmes
    description: Comprendre et sécuriser les réseaux TCP/IP, les accès distants, le Wi-Fi et la messagerie, durcir des serveurs Linux, protéger les postes Windows et Active Directory.
    chapters: [reseaux-tcp-ip, securite-reseau-avancee, securite-linux, windows-active-directory]
  - slug: cryptographie
    title: Cryptographie appliquée
    description: Chiffrement, hachage, signatures et post-quantique ; TLS et certificats ; stockage des mots de passe et gestion des secrets.
    chapters: [crypto-fondamentaux, tls-pki, mots-de-passe-secrets]
  - slug: identite
    title: Identité et accès
    description: Authentification forte et passkeys, sessions sécurisées, autorisation, IAM, SSO, OAuth 2.0 et Zero Trust.
    chapters: [authentification, autorisation-iam]
  - slug: securite-web
    title: Sécurité des applications web, des API et de l'IA
    description: L'OWASP Top 10, les injections et le XSS, le contrôle d'accès, CSRF, CORS et SSRF, la sécurité des API, puis celle des applications utilisant des LLM.
    chapters: [owasp-top10, injections-xss, controle-acces-csrf-ssrf, securite-api, securite-ia-llm]
  - slug: gestion-vulnerabilites
    title: Vulnérabilités, tests d'intrusion et audits
    description: Identifier, prioriser et corriger les vulnérabilités en continu, mener un test d'intrusion méthodique, commander des audits et organiser la divulgation coordonnée.
    chapters: [gestion-vulnerabilites, tests-intrusion, audits-divulgation]
  - slug: detection-reponse
    title: Détection et réponse aux incidents
    description: Journalisation, SIEM, EDR et SOC, détection avec MITRE ATT&CK, renseignement sur la menace et chasse, puis réponse à incident, investigation et rançongiciel.
    chapters: [detection-soc-siem, renseignement-chasse, reponse-incident]
  - slug: cloud-devsecops
    title: Cloud, environnements spécifiques et DevSecOps
    description: Sécuriser le cloud (responsabilité partagée, IAM, configurations, conteneurs), les mobiles, les objets connectés et les systèmes industriels, et intégrer la sécurité au pipeline et à la chaîne logicielle.
    chapters: [securite-cloud, environnements-specifiques, devsecops-supply-chain]
  - slug: gouvernance-humain
    title: Facteur humain, conformité et projet final
    description: L'ingénierie sociale et la culture de sécurité, le paysage réglementaire, puis un projet complet de sécurisation d'une PME.
    chapters: [facteur-humain, conformite-projet-final]
