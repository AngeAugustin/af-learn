slug: product-manager
title: Product Manager
tagline: Choisir le bon problème à résoudre, y compris quand le produit repose sur l'IA.
description: >-
  Un parcours complet et orienté pratique pour devenir Product Manager, puis AI Product
  Manager : discovery, utilisateurs, vision et roadmap, priorisation, spécification,
  travail avec les équipes, métriques, expérimentation, cadrage d'un produit d'IA,
  évaluation, risques et lancement. Chaque chapitre se termine par des exercices et une
  évaluation à valider avec au moins 75 %.
level: Débutant à avancé
color: copper
icon: compass
order: 11
status: published
prerequisites:
  - Avoir déjà utilisé un produit numérique en se demandant pourquoi il est fait ainsi
  - Être à l'aise pour écrire un problème en quelques phrases
  - Aucune expérience de product manager ni de modèle d'IA n'est requise
outcomes:
  - Distinguer le Product Manager du Project Manager, du designer et de l'ingénieur
  - Mener une discovery et formuler un problème prioritaire
  - Construire une roadmap d'outcomes et prioriser un backlog
  - Spécifier un incrément vérifiable et l'accepter avec l'équipe
  - Choisir des métriques produit et lire une expérimentation
  - Cadrer un produit d'IA (promesse, données, évaluation, coût)
  - Lancer, recueillir le retour et itérer sans confondre usage et valeur
