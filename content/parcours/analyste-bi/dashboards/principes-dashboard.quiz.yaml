questions:
  - prompt: "Quelle est la première question à trancher avant de dessiner un tableau de bord ?"
    options:
      - "Quelle décision la page doit-elle permettre de prendre, et pour qui ?"
      - "Quel thème de couleurs l'entreprise utilise-t-elle ?"
      - "Combien de graphiques peut-on placer sur une page 16:9 ?"
      - "Quel export Excel la page doit-elle reproduire à l'identique ?"
    answer: [0]
    explanation: "Sans décision ni public, on collectionne des graphiques. Le titre, le grain et les indicateurs en découlent."

  - prompt: "Pourquoi viser une seule page pour l'essentiel ?"
    options:
      - "Parce que les outils refusent techniquement un second onglet"
      - "Parce que le lecteur doit conclure sans chercher la suite sous la ligne de flottaison"
      - "Parce qu'une seconde page efface les filtres"
      - "Parce que la fraîcheur ne s'affiche que sur la première page"
    answer: [1]
    explanation: "Le scroll et les onglets cachés dispersent la décision. Une autre question mérite une autre page, reliée à la première."

  - prompt: "Que signifie une hiérarchie visuelle réussie ?"
    options:
      - "Tous les visuels ont la même taille pour rester équitables"
      - "Le regard rencontre d'abord le verdict, puis la cause, puis l'action"
      - "Le logo occupe le quart supérieur de la page"
      - "Chaque indicateur a sa propre couleur vive"
    answer: [1]
    explanation: "La taille, la position, le contraste et le vide ordonnent la lecture. Si tout est égal, rien n'est prioritaire."

  - prompt: "Comment afficher correctement la fraîcheur ?"
    options:
      - "Écrire sur la page la date, l'heure et le périmètre des données"
      - "Supposer que le lecteur connaît l'heure du chargement nocturne"
      - "Masquer le retard pour ne pas inquiéter le comité"
      - "N'afficher la date que dans un e-mail séparé"
    answer: [0]
    explanation: "Un chiffre sans date est indécidable. Un retard de chargement se dit sur la page, là où la décision se prend."

  - prompt: "Que met-on plutôt sur une page de direction ? (plusieurs réponses)"
    multiple: true
    options:
      - "Quelques indicateurs avec l'écart à l'objectif"
      - "La liste des quarante mille tickets du mois"
      - "Une tendance et les grandes causes de l'écart"
      - "La décision visée et la date de fraîcheur"
    answer: [0, 2, 3]
    explanation: "La direction arbitre un cap. Le détail ticket par ticket relève d'un rapport paginé ou d'une vue opérationnelle."

  - prompt: "Que met-on plutôt sur une page opérationnelle ? (plusieurs réponses)"
    multiple: true
    options:
      - "Une file courte d'exceptions à traiter"
      - "Le grain du jour, du magasin ou de la référence"
      - "Un unique chiffre annuel sans seuil d'action"
      - "Le geste attendu (appeler, réapprovisionner, corriger)"
    answer: [0, 1, 3]
    explanation: "Le terrain agit. Une page sans seuil ni liste d'exceptions ne dit pas quoi faire aujourd'hui."

  - prompt: "Pourquoi ne pas construire une seule page « pour la direction et les magasins » ?"
    options:
      - "Parce que les outils interdisent deux publics sur un même modèle"
      - "Parce que les questions, le grain et le niveau de détail ne sont pas les mêmes"
      - "Parce que la fraîcheur serait alors impossible à calculer"
      - "Parce que les définitions d'indicateurs devraient diverger"
    answer: [1]
    explanation: "On partage le modèle et les définitions. On sépare les mises en page, puis on les relie."

  - prompt: "À quoi sert surtout un rapport paginé ?"
    options:
      - "À remplacer tous les tableaux de bord interactifs"
      - "À fournir un état stable, paginé, exportable, pour archiver ou justifier"
      - "À afficher un verdict en trente secondes sur un écran"
      - "À multiplier les filtres visuels pendant une réunion"
    answer: [1]
    explanation: "Le rapport paginé détaille, s'imprime, se conserve. Le tableau de bord sert à décider à l'écran."

  - prompt: "Un comité veut le grand livre des remises dans le tableau de bord « au cas où ». Que faites-vous ?"
    options:
      - "Vous collez les 200 lignes sous les indicateurs pour éviter un second livrable"
      - "Vous gardez le verdict sur la page et vous mettez le grand livre en rapport paginé ou en annexe"
      - "Vous supprimez les indicateurs pour laisser la place au grand livre"
      - "Vous envoyez le grand livre par e-mail sans lien avec le chiffre officiel"
    answer: [1]
    explanation: "L'annexe sert ceux qui vérifient. Elle ne doit ni écraser la page ni devenir un classeur parallèle non contrôlé."

  - prompt: "Les ventes sont à J-1 et les stocks à l'heure. Quel risque si la page n'en dit rien ?"
    options:
      - "Aucun, les lecteurs font la moyenne"
      - "Une fausse alerte, par exemple un magasin jugé en retard alors que sa journée n'est pas chargée"
      - "L'outil refuse d'afficher les deux"
      - "La hiérarchie visuelle s'en trouve améliorée"
    answer: [1]
    explanation: "Deux horloges se déclarent. Sinon, on compare des chiffres qui ne parlent pas du même instant."

  - prompt: "Quel titre est acceptable pour une page de pilotage ?"
    options:
      - "Export_ventes_v3_final"
      - "Pilotage marge du réseau, mois en cours"
      - "Graphiques divers"
      - "Copie du classeur de Léa"
    answer: [1]
    explanation: "Le titre nomme la décision et le périmètre. Le nom du fichier source n'aide pas le lecteur."

  - prompt: "Où placer de préférence le verdict (chiffre et écart à l'objectif) ?"
    options:
      - "En tête de page, plus grand que les graphiques d'explication"
      - "Dans une info-bulle au survol du logo"
      - "Uniquement dans l'annexe paginée"
      - "En bas à droite, en corps de texte courant"
    answer: [0]
    explanation: "Le chemin de lecture part du verdict. Un chiffre petit et bas est un chiffre que l'on ne voit pas."

  - prompt: "Une deuxième page se justifie surtout quand :"
    options:
      - "On a envie d'un onglet de plus pour utiliser toutes les couleurs"
      - "La décision ou le public change, par exemple du cap du mois à la liste d'appels du jour"
      - "Le logo ne tient pas sur la première"
      - "On veut dupliquer les mêmes graphiques avec un autre titre"
    answer: [1]
    explanation: "Une page porte une question. Une autre question, un autre onglet, relié par le filtre ou un lien."
