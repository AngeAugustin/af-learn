slug: analyste-bi
title: Analyste BI
tagline: Concevoir le modèle sémantique et les tableaux de bord qui pilotent l'entreprise.
description: >-
  Un parcours complet et orienté pratique pour devenir Analyste BI : écosystème décisionnel,
  SQL et Power Query, modélisation en étoile, faits et dimensions, DAX (contexte de filtre,
  time intelligence), conception de tableaux de bord, Power BI, Tableau et Looker, couche
  sémantique, certification des jeux de données, gouvernance du self-service et adoption
  par le métier. Chaque chapitre se termine par des exercices et une évaluation à valider
  avec au moins 75 %.
level: Débutant à avancé
domain: Data
skills:
  - Modélisation BI
  - DAX
  - Tableaux de bord
  - Couche sémantique
  - Self-service
color: ocean
icon: dashboard
order: 7
status: published
prerequisites:
  - Être à l'aise avec un tableur (formules, tableaux croisés, filtres)
  - Savoir lire un indicateur métier (chiffre d'affaires, marge, taux)
  - Aucune connaissance préalable en SQL ou en DAX n'est requise
outcomes:
  - Situer l'analyste BI entre le métier, l'entrepôt et les outils de restitution
  - Préparer et contrôler des données avec SQL et Power Query
  - Modéliser un schéma en étoile fiable (faits, dimensions, relations, historisation)
  - Écrire des mesures DAX correctes, y compris la time intelligence
  - Concevoir un tableau de bord lisible, performant et accessible
  - Comparer Power BI, Tableau et une couche sémantique type LookML
  - Certifier un jeu de données et encadrer le self-service
  - Faire adopter un rapport par une revue de pilotage
