questions:
  - prompt: "À quoi sert un centre d'excellence BI, même petit ?"
    options:
      - "À produire personnellement tous les rapports de l'entreprise"
      - "À tenir des définitions et des standards communs, sans devenir l'unique goulet"
      - "À interdire toute exploration locale"
      - "À choisir les cibles commerciales à la place des directions"
    answer: [1]
    explanation: "S'il livre tout, il est trop lent et les classeurs reviennent. S'il n'existe pas, chaque direction réinvente le CA."

  - prompt: "Que possède le rôle métier ?"
    options:
      - "Le contrat de l'indicateur et la cible de la décision"
      - "L'actualisation technique de la plateforme"
      - "La police du logo"
      - "Le droit de recopier la mesure dans un fichier personnel officiel"
    answer: [0]
    explanation: "Le métier tranche les cas limites et vient en revue avec la cause. Il ne réécrit pas la formule dans son coin."

  - prompt: "Que fait l'analyste BI dans ce partage ?"
    options:
      - "Il change le périmètre du CA si la page est plus jolie ainsi"
      - "Il met le contrat en œuvre, conçoit la page, contrôle les totaux, forme les référents"
      - "Il remplace la plateforme et le comité"
      - "Il certifie sans relecture métier"
    answer: [1]
    explanation: "Il peut refuser une page illisible. Il n'est pas propriétaire du sens du chiffre."

  - prompt: "Que ne choisit pas la plateforme ?"
    options:
      - "Les espaces, les droits et la surveillance de l'actualisation"
      - "La cible métier et la certification à la place du propriétaire"
      - "La charge d'un modèle trop lourd"
      - "L'heure de chargement après la disponibilité des sources"
    answer: [1]
    explanation: "La plateforme tient l'accès. Elle ne décide pas de ce qu'est la marge, ni n'ajoute des colonnes « au cas où » dans tous les modèles."

  - prompt: "Quels standards méritent un refus en publication large ? (plusieurs réponses)"
    multiple: true
    options:
      - "La page ne pointe pas vers un jeu certifié"
      - "La fraîcheur et le périmètre sont absents"
      - "Une mesure officielle est recopiée et modifiée dans le visuel"
      - "La teinte de bleu diffère légèrement de la charte"
    answer: [0, 1, 2]
    explanation: "La charte peut être un guide. Bloquer sur le bleu et laisser passer un second CA inverse les priorités."

  - prompt: "Une permanence utile, c'est :"
    options:
      - "Un créneau souvent annulé, où l'on s'engage à livrer pour jeudi"
      - "Un horaire fixe, sur le jeu réel, qui oriente sans devenir un guichet de développement"
      - "Un manuel de quarante pages sans rendez-vous"
      - "Une réunion où l'on recertifie en silence"
    answer: [1]
    explanation: "On répond : déjà possible, à prioriser, ou brouillon d'équipe. Livrer passe par la liste, pas par le créneau."

  - prompt: "Comment prioriser de façon défendable ? (plusieurs réponses)"
    multiple: true
    options:
      - "Une décision datée passe devant une mosaïque sans usage"
      - "Réparer une métrique certifiée passe devant un graphique nouveau"
      - "Le premier e-mail du matin gagne toujours"
      - "Une question déjà couverte par le jeu se traite en montrant le geste, pas en ouvrant un projet"
    answer: [0, 1, 3]
    explanation: "La liste est courte et les non sont motivés. Vingt priorités signifient qu'il n'y en a aucune."

  - prompt: "Le marketing veut « ses propres calculs de CA » dans un dashboard pour hier. Première réponse ?"
    options:
      - "Ouvrir un second CA tout de suite"
      - "Demander la décision visée et traiter l'écart au certifié comme un sujet de contrat, pas comme une copie"
      - "Laisser la plateforme inventer un entrepôt parallèle dans la semaine"
      - "Refuser toute conversation"
    answer: [1]
    explanation: "Le métier, l'analyste et la plateforme n'ont pas la même question. « Complet pour hier » n'est pas un critère de priorité."

  - prompt: "Pourquoi ne pas étendre tous les standards aux brouillons personnels ?"
    options:
      - "Parce que la police du logo sur un brouillon épuise la bienveillance sans protéger le chiffre"
      - "Parce que les brouillons sont toujours la source du comité"
      - "Parce que les standards sont facultatifs aussi en publication large"
      - "Parce que le métier ne filtre jamais"
    answer: [0]
    explanation: "Le bloquant vise la diffusion large. Le brouillon reste libre s'il ne se fait pas passer pour officiel."

  - prompt: "À quoi le centre se juge-t-il ?"
    options:
      - "Au nombre de documents de standards produits dans l'année"
      - "À l'usage : moins de chiffres concurrents, des revues sur la même page, des badges que l'on ose retirer"
      - "Au nombre de rapports qu'il fabrique seul"
      - "À l'absence de permanences"
    answer: [1]
    explanation: "Les documents ne prouvent pas que les directions ont cessé les pièces jointes."

  - prompt: "Trois questions reviennent en permanence. Que peut-ce être ?"
    options:
      - "Un hasard sans suite"
      - "Une formation à refaire, une métrique manquante, ou un standard mal placé"
      - "Une raison de supprimer le jeu certifié"
      - "La preuve que la priorisation est inutile"
    answer: [1]
    explanation: "Le carnet des permanences alimente le dispositif. Il ne reste pas un cahier de doléances."

  - prompt: "Une personne porte en permanence les trois rôles. Quel risque ?"
    options:
      - "Aucun, c'est la cible idéale"
      - "Elle devient juge de la certification et producteur pressé en même temps"
      - "Les standards deviennent automatiquement courts"
      - "La plateforme actualise mieux"
    answer: [1]
    explanation: "Dans une petite structure, deux rôles peuvent se cumuler. Les trois en continu créent un conflit d'intérêt."

  - prompt: "« Pas cette semaine, la recertification du CA est devant votre mosaïque. » Cette phrase est :"
    options:
      - "Un non défendable, parce que le critère est visible"
      - "Interdite, il faut tout accepter"
      - "Un remplacement du propriétaire métier"
      - "Une certification"
    answer: [0]
    explanation: "Le silence pousse au classeur du week-end. Un non motivé garde la demande dans la file."
