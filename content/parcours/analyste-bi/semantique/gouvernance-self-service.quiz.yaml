questions:
  - prompt: "Que signifie un libre-service encadré ?"
    options:
      - "Chacun redéfinit le chiffre d'affaires s'il le fait dans l'outil officiel"
      - "On explore et on découpe sur des définitions certifiées, sans en faire une nouvelle source au passage"
      - "Toute exploration est interdite, pour éviter les écarts"
      - "Les pièces jointes du lundi sont la source prioritaire"
    answer: [1]
    explanation: "L'interdiction pousse aux exports. L'absence de cadre produit des versions contradictoires."

  - prompt: "Quand un rapport local devient-il un problème ?"
    options:
      - "Dès qu'il existe, même pour une préparation personnelle le mardi"
      - "Quand la revue le commente à la place du jeu certifié"
      - "Quand il utilise un filtre de mois"
      - "Quand son auteur sait le refaire"
    answer: [1]
    explanation: "Préparer est légitime. Présenter une copie retouchée comme le chiffre de décision ne l'est pas."

  - prompt: "Quels signes montrent qu'un rapport devient sauvage ? (plusieurs réponses)"
    multiple: true
    options:
      - "Il porte son propre nom de chiffre d'affaires"
      - "Il circule en pièce jointe"
      - "Il affiche la fraîcheur du jeu certifié et s'y branche"
      - "Son auteur est le seul à pouvoir le refaire"
    answer: [0, 1, 3]
    explanation: "Le branchement sur le jeu, avec la fraîcheur visible, est au contraire le bon usage."

  - prompt: "Que doit couvrir la formation minimale ?"
    options:
      - "Uniquement l'historique de l'entreprise"
      - "Le catalogue, le badge, le risque de mal sommer un ratio, et à qui poser une question de définition"
      - "La façon de masquer le badge"
      - "L'envoi large dès le premier jour"
    answer: [1]
    explanation: "On forme sur le jeu réel. Un manuel seul ne capte pas les questions. Un créneau régulier les attrape."

  - prompt: "Promouvoir un classeur très suivi, c'est :"
    options:
      - "Le déposer tel quel dans l'application"
      - "Refaire la question sur le jeu certifié, expliquer les écarts, puis retirer la copie"
      - "Interdire à son auteur d'ouvrir l'application"
      - "Moyenner le classeur et le jeu certifié"
    answer: [1]
    explanation: "Tant que les deux chiffres diffèrent sans explication, les lecteurs reviendront au fichier."

  - prompt: "Pendant la revue des usages, quelles issues sont saines ? (plusieurs réponses)"
    multiple: true
    options:
      - "Promouvoir la question sur le jeu officiel"
      - "Raccorder les utilisateurs à une exploration déjà possible"
      - "Laisser mourir un envoi que plus personne ne utilise"
      - "Coller un badge sur toutes les pièces jointes pour simplifier"
    answer: [0, 1, 2]
    explanation: "On choisit un devenir. Badger les copies sans contrôle vide le sens du badge."

  - prompt: "Qui devrait pouvoir publier une page à toute l'entreprise ?"
    options:
      - "Toute personne qui sait exporter"
      - "Un rôle prévu (responsable du jeu ou auteur habilité), après une liste courte de contrôles"
      - "Un stagiaire, s'il est pressé"
      - "Personne, la publication large est toujours un incident"
    answer: [1]
    explanation: "Explorer est large. Publier à un grand public est un droit distinct, avec un délai de réponse connu."

  - prompt: "Un directeur arrive avec 1,18 M€ en pièce jointe, l'application dit 1,12 M€. Que commente-t-on en séance ?"
    options:
      - "1,18 M€, parce que la pièce jointe est plus récente dans la discussion"
      - "1,12 M€, le chiffre certifié, et l'autre périmètre devient une demande, pas une correction"
      - "La moyenne, 1,15 M€"
      - "Aucun des deux, on reporte sans le dire"
    answer: [1]
    explanation: "Décider sur la pièce jointe consacre le rapport sauvage. La question « hors marketplaces » peut être légitime, pas son support."

  - prompt: "Une vue partagée seulement avec son équipe doit :"
    options:
      - "Porter le même nom que la page du comité"
      - "Être libellée comme vue d'équipe, sans badge de certification"
      - "Remplacer l'actualisation du jeu"
      - "Circuler aussi en pièce jointe à tous les magasins"
    answer: [1]
    explanation: "Le libellé honnête évite de prendre une vue locale pour la source de décision."

  - prompt: "Pourquoi un circuit de publication sans délai connu échoue-t-il ?"
    options:
      - "Parce que les gens republient en pièce jointe plutôt que d'attendre sans horizon"
      - "Parce que Git refuse les délais"
      - "Parce que la formation devient inutile"
      - "Parce que les ratios s'additionnent mal"
    answer: [0]
    explanation: "Le cadre théorique cède devant l'urgence. Un délai court et tenu garde les demandes dans le circuit."

  - prompt: "Changer le périmètre du CA dans son exploration personnelle, c'est :"
    options:
      - "L'usage normal du libre-service"
      - "Un changement de contrat, qui passe par le propriétaire, pas un filtre anodin"
      - "Obligatoire avant chaque comité"
      - "Le rôle du lecteur"
    answer: [1]
    explanation: "Filtrer une région est une liberté. Redéfinir le chiffre en est une autre, beaucoup plus lourde."

  - prompt: "Que fait le responsable du jeu qu'un explorateur ne fait pas ?"
    options:
      - "Ouvrir l'application"
      - "Changer une métrique certifiée, retirer un badge, accepter une page dans l'application"
      - "Filtrer le mois en cours"
      - "Poser une question en office hours"
    answer: [1]
    explanation: "Les rôles se cumulent du lecteur jusqu'au responsable. On élargit le rôle après des publications justes en petit comité."

  - prompt: "Deux enseignes sont « ajustées » dans un classeur très suivi. Avant de basculer vers le jeu, il faut :"
    options:
      - "Reprendre l'ajustement en silence pour que les chiffres collent"
      - "Faire trancher par le propriétaire si l'ajustement devient une règle pour tous, ou seulement une note"
      - "Moyenner l'ajustement"
      - "Supprimer la marge officielle"
    answer: [1]
    explanation: "Un ajustement local n'entre dans le contrat que s'il est assumé. Sinon la page officielle ne le recopie pas."
