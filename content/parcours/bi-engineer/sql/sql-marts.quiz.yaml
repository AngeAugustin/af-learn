questions:
  - prompt: "Que publie le SELECT du mart, plutôt qu'une exploration ?"
    options:
      - "Uniquement les tickets de mars 2026"
      - "Une ligne par ligne_id, montants déjà signés, hors personnel"
      - "Le taux de marge de chaque ticket"
      - "La région recopiée sur chaque ligne"
    answer: [1]
    explanation: "fct_ventes garde l'historique au grain du ticket. Mars est un filtre de lecture. Le taux et la région n'y sont pas copiés."

  - prompt: "Pourquoi le WHERE de mars n'est-il pas dans la construction de fct_ventes ?"
    options:
      - "Parce que mars 2025 doit rester disponible pour le N-1"
      - "Parce que SQL interdit les dates"
      - "Parce que Nora ne filtre jamais"
      - "Parce que charge_le remplace jour"
    answer: [0]
    explanation: "Figer mars 2026 efface mars 2025 et oblige à réécrire la table chaque mois. Le filtre de période est une question."

  - prompt: "Où Nora trouve-t-elle la région ?"
    options:
      - "Dans une colonne region collée sur fct_ventes"
      - "En joignant dim_magasin sur magasin_id"
      - "Dans ticket_id"
      - "Dans le topic Kafka"
    answer: [1]
    explanation: "La région est un attribut de dimension. La corriger se fait à un seul endroit, pas sur chaque ticket."

  - prompt: "Quel nom de colonne refusez-vous pour le montant signé ?"
    options:
      - "montant_ht_signe"
      - "ca_v3"
      - "marge_ht pour la différence au même grain"
      - "quantite pour les unités"
    answer: [1]
    explanation: "Un nom versionné casse les mesures. montant_ht_signe reste. La phrase longue est dans la description de CA HT."

  - prompt: "Quelle est la différence entre jour et charge_le ?"
    options:
      - "Aucune, les deux datent la vente"
      - "jour est le jour de vente, charge_le est l'heure de dépôt"
      - "charge_le est le N-1"
      - "jour est le mois de budget"
    answer: [1]
    explanation: "Un retour du 28 février peut être chargé en mars. Le CA de mars filtre jour. La fraîcheur regarde charge_le."

  - prompt: "Trois fichiers lisent caisse.lignes avec des filtres presque identiques. Que faites-vous ?"
    options:
      - "Vous gardez le plus proche et vous le commentez"
      - "Vous les rebranchez sur la somme de montant_ht_signe"
      - "Vous en ajoutez un quatrième dans la page de Nora"
      - "Vous publiez les trois sous le nom CA HT"
    answer: [1]
    explanation: "Des copies qui divergent sont le mart qui n'est pas branché. Mars doit retrouver 6 240 000 €, pas trois totaux."

  - prompt: "ticket_id, sur le fait, sert à quoi ?"
    options:
      - "À remplacer ligne_id comme grain"
      - "À identifier le ticket, sans dimension qui ne contiendrait que cette clé"
      - "À stocker la région"
      - "À calculer 35 % sur chaque ligne"
    answer: [1]
    explanation: "C'est un identifiant dégénéré. Le grain reste la ligne. Une dim_ticket vide n'apporte pas d'attribut."

  - prompt: "Joindre un budget mensuel sur chaque ticket de fct_ventes fait quoi ?"
    options:
      - "Il attribue le budget une fois par magasin et par mois"
      - "Il répète le budget sur chaque ligne, et la somme explose"
      - "Il remplace le témoin par 6 000 000 €"
      - "Il signe les retours"
    answer: [1]
    explanation: "Le budget n'est pas au grain du ticket. On agrège les ventes d'abord, puis on joint au niveau commun."

  - prompt: "La lecture que Nora a le droit d'écrire ressemble à quoi ?"
    options:
      - "Un CASE sur caisse.lignes qui retire le personnel"
      - "SUM(montant_ht_signe) groupé par magasin, jour et produit"
      - "Une moyenne des taux de lignes"
      - "Un SELECT du topic Kafka"
    answer: [1]
    explanation: "La page somme le mart. Elle obtient les ventes par magasin, jour et produit sans réécrire le périmètre."

  - prompt: "Un magasin passe de l'Ouest au Nord dans dim_magasin. Les tickets de mars ont encore le texte Ouest collé dans le fait. Que voyez-vous ?"
    options:
      - "La région de la dimension, donc Nord pour ce magasin"
      - "L'ancienne région figée, et l'Ouest de mars qui ne suit plus les mêmes magasins"
      - "Un échec de Kafka"
      - "Le N-1 qui devient février"
    answer: [1]
    explanation: "Copier l'attribut fige le passé au chargement. La région se joint. Elle ne se stocke pas sur le ticket."

  - prompt: "Que doit rester le mart ?"
    options:
      - "Un récit du lundi, avec un CASE par magasin à mettre en avant"
      - "Peu de colonnes, des noms connus, le périmètre déjà appliqué"
      - "Une copie par régional"
      - "Le seul mois en cours"
    answer: [1]
    explanation: "Ennuyeux veut dire stable. Le récit et le mois sont des questions de page."

  - prompt: "Lesquelles de ces colonnes appartiennent à fct_ventes ? (plusieurs réponses)"
    multiple: true
    options:
      - "ligne_id"
      - "montant_ht_signe"
      - "region"
      - "marge_ht"
    answer: [0, 1, 3]
    explanation: "La clé, le montant signé et la marge en euros sont au grain de la ligne. La région est dans dim_magasin."

  - prompt: "Lesquels de ces gestes recréent des CA divergents ? (plusieurs réponses)"
    multiple: true
    options:
      - "Sommer montant_ht_signe dans toutes les pages"
      - "Laisser chaque fichier lire caisse.lignes avec son propre filtre"
      - "Garder trois requêtes titrées CA HT qui ne traitent pas les retours de la même façon"
      - "Contrôler que mars vaut 6 240 000 € après branchement"
    answer: [1, 2]
    explanation: "Les copies sur la source divergent. La somme unique du mart, contrôlée sur le témoin, est le geste qui les retire."
