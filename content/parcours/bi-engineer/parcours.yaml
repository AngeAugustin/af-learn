slug: bi-engineer
title: BI Engineer
tagline: Construire la couche analytique que les analystes consomment sans la réinventer.
description: >-
  Un parcours complet et orienté pratique pour devenir BI Engineer : marts SQL, modèle en
  étoile implémenté, dbt, couche sémantique, sécurité, performance, tests, intégration
  continue et déploiement des modèles. Chaque chapitre se termine par des exercices et une
  évaluation à valider avec au moins 75 %.
level: Débutant à avancé
color: indigo
icon: boxes
order: 13
status: published
prerequisites:
  - Savoir écrire un SELECT, des jointures et un GROUP BY
  - Avoir déjà ouvert un rapport ou un tableau de bord
  - Aucune expérience préalable de dbt ou de modèle sémantique n'est requise
outcomes:
  - Situer le BI Engineer entre le Data Engineer et l'Analyste BI
  - Construire des marts au bon grain, testés et documentés
  - Implémenter un schéma en étoile et des dimensions historisées
  - Publier une couche sémantique (mesures, sécurité, agrégations)
  - Rendre un modèle rapide et une fraîcheur observable
  - Livrer les transformations et les modèles par une chaîne automatisée
  - Certifier un jeu que les analystes peuvent réutiliser
