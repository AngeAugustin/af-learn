questions:
  - prompt: "Quelle est la clé primaire de fct_ventes ?"
    options:
      - "Le triplet magasin, jour, produit"
      - "ligne_id"
      - "ticket_id seul"
      - "region"
    answer: [1]
    explanation: "Une ligne de ticket, une clé. Magasin, jour et produit sont des clés étrangères que la revue groupe."

  - prompt: "Pourquoi ticket_id reste-t-il sur le fait ?"
    options:
      - "Parce qu'il remplace ligne_id"
      - "Parce qu'il identifie le ticket sans avoir d'attributs à mettre dans une dimension"
      - "Parce qu'il porte la région"
      - "Parce qu'il vaut 35 %"
    answer: [1]
    explanation: "Identifiant dégénéré : utile pour un comptage distinct, inutile comme table à une seule colonne. Plusieurs lignes partagent un ticket."

  - prompt: "Où vit la région ?"
    options:
      - "Recopiée sur chaque ticket au chargement"
      - "Dans dim_magasin, jointe par magasin_id"
      - "Dans charge_le"
      - "Dans la mesure taux"
    answer: [1]
    explanation: "Un changement de région se corrige dans la dimension. Le texte collé sur le ticket fige l'ancien rattachement."

  - prompt: "Que doit montrer le contrôle d'étoile sur mars ?"
    options:
      - "Une somme plus basse après jointure, les orphelins étant écartés"
      - "Le même nombre de ligne_id et les mêmes 6 240 000 € avant et après les trois jointures"
      - "Un doublement, signe que les dimensions sont riches"
      - "42 taux moyens"
    answer: [1]
    explanation: "Une dimension unique sur sa clé ne multiplie pas et ne perd pas. L'étoile est livrée quand ce contrôle passe."

  - prompt: "marge_ht a le droit d'être dans le fait parce que..."
    options:
      - "c'est un taux"
      - "c'est la différence de deux montants au même grain, donc additive"
      - "c'est le stock du soir"
      - "c'est le commentaire de Nora"
    answer: [1]
    explanation: "2 184 000 € en mars est une somme de marges. Le taux 35 % se calcule après, il ne se stocke pas sur la ligne."

  - prompt: "Laquelle de ces colonnes n'entre pas dans fct_ventes ?"
    options:
      - "quantite vendue"
      - "charge_le comme témoin de dépôt"
      - "Le taux de marge"
      - "produit_id"
    answer: [2]
    explanation: "Le taux n'est pas un montant de la ligne. Le stock, le rang et le commentaire de revue n'y entrent pas non plus."

  - prompt: "À quoi sert la ligne « inconnu » de dim_magasin ?"
    options:
      - "À supprimer le CA dont la clé n'a pas de référentiel"
      - "À garder le montant visible au lieu de le perdre dans un INNER JOIN"
      - "À doubler les 42 magasins"
      - "À remplacer Camille"
    answer: [1]
    explanation: "L'orphelin ne doit pas faire baisser mars. Un test compte le CA porté par inconnu. Le trou reste visible."

  - prompt: "dim_date contient-elle les jours sans vente ?"
    options:
      - "Non, seulement les jours présents dans fct_ventes"
      - "Oui, le calendrier existe même sans ticket, et le 31 mars y est en mars"
      - "Non, elle commence en avril"
      - "Oui, mais sans clé"
    answer: [1]
    explanation: "Filtrer le mois sur la dimension n'a de sens que si le 31 est bien rattaché à mars. Vous le vérifiez."

  - prompt: "Nora prend CA HT, Région et Famille, et filtre mars. Que ne voit-elle pas ?"
    options:
      - "Le CA"
      - "Le JOIN, déjà posé dans le modèle"
      - "La famille"
      - "Le mois"
    answer: [1]
    explanation: "C'est le but de l'étoile. Si la jointure manque, vous étendez le modèle. Vous ne rendez pas un SQL sur caisse.lignes."

  - prompt: "Combien de magasins intégrés la dimension métier décrit-elle ?"
    options:
      - "40"
      - "42, plus la ligne inconnu s'il le faut"
      - "12"
      - "Un par ticket"
    answer: [1]
    explanation: "Quarante-deux intégrés. L'inconnu n'est pas un quarante-troisième magasin du réseau : c'est le bac des clés sans référentiel."

  - prompt: "Que garantit une relation de plusieurs ventes vers un magasin ?"
    options:
      - "Filtrer la région fabrique des ventes"
      - "Filtrer la région filtre les tickets, il n'en crée pas"
      - "Chaque magasin n'a qu'un ticket"
      - "Le taux est stocké"
    answer: [1]
    explanation: "Le sens de la relation fait partie de la livraison. Un second chemin vers le CA, par une autre jointure, est une seconde définition."

  - prompt: "Lesquelles de ces colonnes restent dans les dimensions ? (plusieurs réponses)"
    multiple: true
    options:
      - "region"
      - "La famille produit"
      - "montant_ht_signe"
      - "Le nom du magasin"
    answer: [0, 1, 3]
    explanation: "Ce sont des attributs. Le montant signé est une mesure du fait. Les copier sur le ticket les fait diverger."

  - prompt: "Lesquels de ces objets ne sont pas des colonnes du fait ? (plusieurs réponses)"
    multiple: true
    options:
      - "Le taux de marge"
      - "Le stock du soir"
      - "ligne_id"
      - "Le commentaire « l'Ouest décroche »"
    answer: [0, 1, 3]
    explanation: "Taux, stock et phrase de revue ne décrivent pas la ligne de ticket. ligne_id est précisément sa clé."
