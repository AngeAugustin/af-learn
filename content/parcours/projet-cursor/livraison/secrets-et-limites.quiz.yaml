questions:
  - prompt: "L'agent propose d'ajouter le jeton d'aperçu dans .cursor/rules pour l'avoir à chaque demande. Vous..."
    options:
      - "Acceptez : la règle est l'endroit le plus pratique pour un jeton"
      - "Refusez : la règle porte le métier de Sève, pas un secret, et elle est souvent versionnée"
      - "Acceptez à condition de coller aussi le jeton dans le chat"
      - "Remplacez la ligne des 45 € par le jeton, pour ne garder qu'une information"
    answer: [1]
    explanation: "Une clé dans la règle entre dans chaque conversation et souvent dans Git. Le métier (8 places, 45 €, 18 h) reste. Le jeton reste hors du chat."

  - prompt: "L'agent demande le contenu du .env pour comprendre une page vide. Que lui donnez-vous ?"
    options:
      - "Le fichier entier, pour gagner du temps"
      - "Le nom de la variable manquante, pas sa valeur"
      - "Une copie de la clé dans .cursor/rules, plus durable que le chat"
      - "L'autorisation d'ignorer les tests le temps du diagnostic"
    answer: [1]
    explanation: "Le nom de la variable suffit à chercher la panne. La valeur reste hors du fil. Vous la posez vous-même dans le fichier local."

  - prompt: "Quelles sont les trois décisions que Léa garde, même si un test est rouge ?"
    multiple: true
    options:
      - "Le prix de 45 €"
      - "Le plafond de 8 places"
      - "L'heure de 18 h la veille"
      - "Le droit d'ignorer un test gênant"
    answer: [0, 1, 2]
    explanation: "Prix, plafond et heure ne se négocient pas avec le modèle. Ignorer un test n'est pas une décision de Léa, c'est une consigne interdite."

  - prompt: "Le test attend 45 € et l'écran affiche 40 €. L'agent propose de mettre le test à jour. Vous..."
    options:
      - "Acceptez : le test doit suivre l'écran"
      - "Refusez : l'écran est faux, le prix de Léa reste 45 €"
      - "Passez le prix à 50 € pour être au-dessus du test"
      - "Supprimez l'affichage du prix"
    answer: [1]
    explanation: "Un test rouge dit que le code et la règle divergent. Ici la règle tient. On corrige l'écran, on ne déplace pas 45 €."

  - prompt: "Le test de la 9e place échoue. Quelle consigne refusez-vous ?"
    options:
      - "Corriger le code pour que la 9e demande soit refusée"
      - "Relire l'assertion si elle ne suivait pas la règle écrite"
      - "Ignorer ce test en attendant l'incrément de la liste d'attente"
      - "Relancer le test après correction et lire la ligne"
    answer: [2]
    explanation: "L'attente est l'incrément suivant. Elle n'éteint pas le refus d'aujourd'hui. « Ignore les tests » ne fait pas avancer Sève."

  - prompt: "L'agent propose de déplacer la confirmation à 20 h pour une démo, puis de remettre 18 h. Que gardiez-vous ?"
    options:
      - "20 h, le temps de la démo, avec un test aligné sur 20 h"
      - "18 h la veille, dans le plan et dans le test"
      - "Aucune heure : Léa avisera le samedi matin"
      - "Minuit, pour être certain que tout le monde a répondu"
    answer: [1]
    explanation: "18 h est la règle qui vise les 3 absents liés au SMS oublié. Une démo ne la déplace pas, même avec la promesse de la remettre."

  - prompt: "Que peut proposer l'agent sans décider à la place de Léa ?"
    options:
      - "Passer le plafond de 8 à 10 pour les habitués"
      - "La phrase lue par la personne dont la 9e place est refusée"
      - "Une clé SMS écrite dans la règle pour traiter les 3 absents"
      - "L'ordre d'ignorer le test qui protège 45 €"
    answer: [1]
    explanation: "Une formulation, un fichier cité, un test qui protège la règle : oui. Un chiffre métier, un secret ou un test éteint : non."

  - prompt: "Que contient la règle de projet de Sève ?"
    multiple: true
    options:
      - "8 places, 45 €, attente maximum 12, décision avant 18 h la veille"
      - "L'interdiction de modifier ces chiffres pour faire passer un test"
      - "Le jeton d'hébergement, pour ne pas le retaper"
      - "La consigne « ignore les tests » en cas de veille de samedi"
    answer: [0, 1]
    explanation: "La règle porte le métier et l'interdiction de le plier à un test. Elle ne porte ni secret ni permission d'éteindre les tests."

  - prompt: "Pourquoi une clé dans .cursor/rules est-elle plus grave qu'un oubli local ?"
    options:
      - "Parce que la règle est inutile et n'est jamais lue"
      - "Parce qu'elle entre dans les demandes suivantes et souvent dans Git"
      - "Parce que Léa préfère les clés dans le code de la page"
      - "Parce qu'une règle ne peut pas contenir 8 places et 45 €"
    answer: [1]
    explanation: "La règle est du contexte permanent. Un secret dedans se répand dans les fils et dans l'historique du dépôt."

  - prompt: "Un diff utile contient un bon libellé de refus, et il passe aussi le plafond à 10. Vous..."
    options:
      - "Gardez le libellé et le plafond, pour ne pas perdre le travail"
      - "Rejetez le diff entier : la règle a déjà bougé"
      - "Gardez 10 places et demandez un second diff pour le texte"
      - "Acceptez, puis vous remettrez 8 après le commit"
    answer: [1]
    explanation: "On ne sauve pas la partie utile d'un diff qui a changé le métier. 8 places se rétablit avant d'accepter quoi que ce soit."

  - prompt: "La veille du samedi, l'agent propose d'assouplir les 8 places « juste pour la démo ». Vous..."
    options:
      - "Acceptez : la pression du lendemain change la règle"
      - "Refusez comme un mardi : une démo qui accepte la 9e place apprend le contraire de l'atelier"
      - "Passez à 12 places assises, puisque l'attente est plafonnée à 12"
      - "Ignorez le test jusqu'au dimanche"
    answer: [1]
    explanation: "L'urgence ne déplace pas le plafond. Une démo fausse apprend à Léa qu'une 9e place est possible."

  - prompt: "Qui perd si 45 €, 8 places ou 18 h changent dans le code sans décision de Léa ?"
    options:
      - "Personne : ce sont des détails d'exemple"
      - "Léa, le samedi, ou une personne inscrite ou refusée à tort"
      - "Uniquement l'agent, qui devra relire le diff"
      - "Le terminal, dont la sortie deviendra plus longue"
    answer: [1]
    explanation: "Ces trois lignes sont le métier de l'atelier. Les changer pour un test ou une démo a un effet sur les personnes, pas seulement sur le dépôt."

  - prompt: "Comment traitez-vous les 3 absents liés au SMS oublié dans cette limite ?"
    options:
      - "En collant la clé du fournisseur SMS dans la règle"
      - "En rendant d'abord la confirmation visible, sans secret dans le fil"
      - "En supprimant l'heure de 18 h, source de la contrainte"
      - "En ignorant les tests de réservation pour livrer plus vite"
    answer: [1]
    explanation: "Les absents justifient une confirmation visible et une heure tenue. Ils ne justifient pas une clé dans le chat ni un test éteint."
