slug: projet-cursor
title: Développer un projet de bout en bout avec Cursor
tagline: Mener un vrai produit dans l'éditeur, du brief au diff accepté.
description: >-
  Un parcours complet et orienté pratique pour mener un projet de bout en bout avec Cursor :
  modes Agent, Plan, Ask et Tab, contexte et règles, skills, découpage, relecture des diffs,
  tests, débogage, Git, MCP, aperçu navigateur, secrets, injection de consignes,
  données qui sortent de la machine, fichiers ignorés, dépendances et sécurité de la page.
  Le fil rouge est Atelier Sève, un stage de céramique à rendre réservable. Chaque chapitre
  se termine par des exercices et une évaluation à valider avec au moins 75 %.
level: Débutant à avancé
domain: Développement
skills:
  - Cursor
  - Agent
  - Règles de projet
  - Revue de diff
  - Sécurité
  - Git
color: slate
icon: pointer
order: 14
status: published
prerequisites:
  - Avoir déjà modifié un petit projet (HTML, JavaScript ou équivalent)
  - Savoir ouvrir un terminal et un dépôt Git
  - Aucune maîtrise préalable de Cursor n'est requise
outcomes:
  - Choisir le mode Cursor adapté à un geste (demander, planifier, modifier, compléter)
  - Donner un contexte court et des règles que l'agent peut suivre
  - Découper un produit en incréments vérifiables avant de lancer l'agent
  - Relire un diff multi-fichiers et revenir au plan quand le résultat dérive
  - Faire écrire des tests, déboguer et committer sans accepter à l'aveugle
  - Brancher un outil utile et vérifier l'écran comme le ferait le commanditaire
  - Tenir les secrets et les décisions qu'on ne délègue pas
  - Écarter une consigne cachée, une donnée personnelle et une dépendance non relue
