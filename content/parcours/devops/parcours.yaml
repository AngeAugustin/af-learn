slug: devops
title: DevOps
tagline: Livrer souvent, sans surprise, de la chaîne d'intégration jusqu'à la production.
description: >-
  Un parcours complet et orienté pratique pour devenir DevOps : culture de collaboration,
  Git et revues, intégration et déploiement continus, images et registres, Kubernetes,
  infrastructure as code, observabilité, gestion d'incidents, DevSecOps et fiabilité.
  Chaque chapitre se termine par des exercices et une évaluation à valider avec au moins 75 %.
level: Débutant à avancé
color: teal
icon: workflow
order: 8
status: published
prerequisites:
  - Savoir lancer des commandes dans un terminal
  - Avoir déjà modifié un petit projet avec Git
  - Aucune expérience préalable de Kubernetes ou de Terraform n'est requise
outcomes:
  - Expliquer le rôle DevOps et le flux du commit jusqu'à la production
  - Construire un pipeline qui teste, construit et publie une application
  - Choisir une stratégie de déploiement et savoir revenir en arrière
  - Empaqueter une application en image et la décrire pour un orchestrateur
  - Décrire une infrastructure simple as code et séparer les environnements
  - Lire des logs, des métriques et des traces, et tenir un incident
  - Intégrer des contrôles de sécurité sans bloquer toute livraison
  - Argumenter un objectif de fiabilité et un budget d'erreur
