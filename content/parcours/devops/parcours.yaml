modules:
  - slug: fondations
    title: Fondations DevOps
    description: Le métier, la collaboration entre développement et exploitation, et les bases Linux utiles au quotidien.
    chapters: [metier-devops, culture-collaboration, linux-reseau-bases]
  - slug: git
    title: Git et flux de livraison
    description: Travailler à plusieurs, relire, et attacher une version à ce qui part en production.
    chapters: [git-quotidien, branches-revues, versionner-livrer]
  - slug: cicd
    title: Intégration et déploiement continus
    description: Pipelines, qualité automatique, et stratégies pour déployer sans couper le service.
    chapters: [pipeline-principes, pipeline-pratique, qualite-automatique, strategies-deploiement]
  - slug: conteneurs
    title: Conteneurs
    description: Images reproductibles, environnement local, registres et images de confiance.
    chapters: [images-docker, compose-local, registres-securite-images]
  - slug: kubernetes
    title: Kubernetes
    description: Objets, workloads, paquets Helm, configuration et secrets.
    chapters: [kubernetes-objets, workloads-services, helm-paquets, config-secrets]
  - slug: infrastructure
    title: Infrastructure as code
    description: Décrire l'infrastructure, pratiquer Terraform, et séparer les environnements.
    chapters: [infra-as-code, terraform-essentiel, environnements-cloud]
  - slug: observabilite
    title: Observabilité et incidents
    description: Logs, métriques, traces, alertes utiles, et conduite d'un incident.
    chapters: [signaux-observabilite, alertes-slo, gestion-incidents]
  - slug: fiabilite
    title: Sécurité et fiabilité
    description: Contrôles dans la chaîne, identités et secrets, budget d'erreur et coût.
    chapters: [devsecops, secrets-identites, sre-budget-erreur, cout-capacite]
  - slug: projet
    title: Plateforme de livraison
    description: Cadrer une plateforme, assembler un pipeline de référence, puis le projet final.
    chapters: [plateforme-cible, pipeline-reference, projet-final]
