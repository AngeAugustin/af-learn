questions:
  - prompt: "Qui doit porter l'identité qui déploie en production ?"
    options:
      - "Le jeton personnel de la personne qui a cliqué"
      - "Le compte de service du pipeline, limité au déploiement du service"
      - "Un kubeconfig d'administrateur partagé dans le canal"
      - "Le mot de passe de la base, réutilisé comme clé cloud"
    answer: [1]
    explanation: "La personne approuve. Le job déploie, avec un droit étroit. Un jeton humain dans la chaîne mélange départ, fuite et largeur de droits."

  - prompt: "Quelle liste d'approbation est cohérente pour une équipe de huit ?"
    options:
      - "Tout le monde possède le kubeconfig admin et déploie depuis son poste"
      - "Deux ou trois personnes peuvent approuver, l'auteur ne s'approuve pas seul"
      - "Une seule personne, sans remplaçant, pour que ce soit simple"
      - "Aucune approbation, le pipeline pousse en prod dès le commit"
    answer: [1]
    explanation: "La liste courte évite le mot de passe partagé et le bus factor d'une seule personne. L'auteur ne juge pas seul son propre passage en production."

  - prompt: "Qu'est-ce qui distingue un compte humain d'un compte de service ? (plusieurs réponses)"
    multiple: true
    options:
      - "L'humain représente une personne et se révoque le jour du départ"
      - "Le compte de service représente un job, sans session interactive"
      - "Le jeton humain est le bon choix pour les variables du pipeline"
      - "Les droits du compte de service tiennent en une fiche de verbes précis"
    answer: [0, 1, 3]
    explanation: "Personne et job ne se prêtent pas leurs clés. Le jeton personnel dans le CI est précisément le mélange à éviter."

  - prompt: "Pourquoi préférer un jeton d'une heure obtenu par la forge ?"
    options:
      - "Il reste valide même si les logs fuient, ce qui rassure"
      - "Une fuite de log ne laisse pas une clé qui marche encore le lendemain"
      - "Il remplace le besoin d'un coffre pour les secrets de la base"
      - "Il doit être copié dans Git pour que l'équipe le retrouve"
    answer: [1]
    explanation: "La clé longue dans les variables survit à la fuite. Le jeton court meurt avec le job. Les secrets d'application restent dans le coffre."

  - prompt: "Où un secret de production ne doit-il pas se trouver ?"
    options:
      - "Dans le coffre, lu par l'identité du service"
      - "Dans un fichier envoyé sur le canal, ou dans un .env partagé"
      - "Dans une valeur distincte de celle de staging"
      - "Derrière une lecture tracée"
    answer: [1]
    explanation: "Le canal et le fichier partagé ne se révoquent pas et ne séparent pas les environnements. Le coffre trace qui a lu quoi."

  - prompt: "Quel ordre de rotation évite un arrêt long du mot de passe de base ?"
    options:
      - "Retirer l'ancien, puis seulement après redémarrer les pods"
      - "Accepter les deux valeurs, mettre à jour le coffre, recharger les pods, vérifier, puis retirer l'ancien"
      - "Écrire le nouveau mot de passe dans le README, sans toucher aux pods"
      - "Garder l'ancien indéfiniment et ajouter le nouveau dans un second fichier"
    answer: [1]
    explanation: "Le chevauchement laisse les pods relire avant la révocation. Retirer d'abord coupe toutes les commandes d'un coup."

  - prompt: "Sam a collé son jeton personnel dans le pipeline. Quels risques sont déjà là ? (plusieurs réponses)"
    multiple: true
    options:
      - "Le départ de Sam casse la livraison ou laisse une clé orpheline"
      - "Le jeton est souvent plus large que le seul droit de déployer"
      - "Le pipeline est enfin un vrai compte de service"
      - "Une fuite de log expose un accès humain sans expiration"
    answer: [0, 1, 3]
    explanation: "Le pipeline est Sam. On crée l'identité du job, on retire le jeton des variables, on le révoque. Le confort du mardi est le risque du jeudi."

  - prompt: "À quoi sert un accès break-glass ?"
    options:
      - "À déployer tous les vendredis plus vite que le pipeline"
      - "À un secours rare, tracé, revu le lendemain, inutilisé au quotidien"
      - "À remplacer l'authentification forte des humains"
      - "À partager un mot de passe d'admin dans un tiroir"
    answer: [1]
    explanation: "S'il sert chaque semaine, ce n'est plus un secours. On le teste hors incident. On ne s'en sert pas comme chemin normal."

  - prompt: "Le jour du départ, que révoque-t-on tout de suite ?"
    options:
      - "Tous les comptes de service, même ceux du pipeline encore nécessaires"
      - "Le compte humain, ses sessions, ses approbations et ses jetons personnels"
      - "Uniquement l'adresse de messagerie, les clés cloud peuvent attendre"
      - "Rien, le pipeline utilise peut-être encore son jeton"
    answer: [1]
    explanation: "L'humain part. Les comptes de service restent, avec un responsable nommé. S'ils dépendaient du jeton de la personne, c'est le défaut à corriger, pas une raison de le laisser vivant."

  - prompt: "Staging et production, pour les secrets :"
    options:
      - "Partagent la même valeur pour simplifier la fumée"
      - "Ont des valeurs distinctes, le secret de staging n'ouvre pas la prod"
      - "Sont commitées dans deux branches publiques"
      - "Vivent dans le même message épinglé"
    answer: [1]
    explanation: "Un secret de staging qui ouvre la production annule la séparation des environnements. Le coffre porte les deux, avec des identités différentes."

  - prompt: "Une copie du mot de passe traîne dans un script de poste. Quand la traite-t-on pendant la rotation ?"
    options:
      - "Jamais, ce n'est pas le coffre officiel"
      - "Avant de déclarer la rotation finie, en supprimant la copie ou en la sortant du secret de prod"
      - "Seulement au prochain audit annuel"
      - "Après avoir oublié l'ancienne valeur, pour gagner du temps"
    answer: [1]
    explanation: "La copie reste un accès ou un piège le jour où quelqu'un relance le script. La liste des copies fait partie de la rotation."

  - prompt: "Quels énoncés décrivent une clé longue encore acceptée ? (plusieurs réponses)"
    multiple: true
    options:
      - "Elle vit dans le coffre, pas dans un fichier"
      - "Elle a une date de rotation écrite"
      - "Elle est dans le dépôt pour que l'équipe la retrouve"
      - "Un seul job peut la lire"
    answer: [0, 1, 3]
    explanation: "La clé longue est une dette visible et bornée. La mettre dans Git la rend impossible à oublier pour de mauvaises raisons, et impossible à contenir."

  - prompt: "L'application commandes et le pipeline doivent-ils partager la même clé de base ?"
    options:
      - "Oui, une seule clé pour toute l'équipe est plus simple"
      - "Non, l'application lit son secret, le pipeline déploie, chacun son identité"
      - "Oui, si la clé est personnelle"
      - "Non, donc on se passe de secret en production"
    answer: [1]
    explanation: "Déployer n'est pas lire la base. Deux identités, deux fiches de droits. Le partage élargit chaque fuite aux deux métiers."
