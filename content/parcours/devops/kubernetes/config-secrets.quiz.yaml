questions:
  - prompt: "Où placez-vous LOG_LEVEL et l'URL publique du site ?"
    options:
      - "Dans un Secret, parce que toute config est sensible"
      - "Dans un ConfigMap versionné"
      - "Dans le .env copié dans l'image"
      - "Dans le tag de l'image"
    answer: [1]
    explanation: "Ces valeurs ne donnent aucun pouvoir. Elles vivent dans un ConfigMap relu en review. Le niveau debug du poste, lui, reste local."

  - prompt: "Pourquoi base64 dans un Secret n'est-il pas un chiffrement ?"
    options:
      - "Parce que kubectl get secret -o yaml se décode en une commande"
      - "Parce que Kubernetes refuse stringData"
      - "Parce que le ConfigMap est plus secret"
      - "Parce que le base64 change à chaque lecture"
    answer: [0]
    explanation: "Encoder n'est pas chiffrer. Qui peut lire l'objet Secret obtient la valeur. Le chiffrement d'etcd est un réglage du cluster, pas un effet du mot Secret."

  - prompt: "Un commit contient stringData.DATABASE_URL avec le vrai mot de passe, un commit suivant supprime le fichier. Que faites-vous en premier ?"
    options:
      - "Rien, le fichier n'est plus sur la branche principale"
      - "Faire tourner le mot de passe, l'ancien étant déjà public dans l'historique"
      - "Réencoder la valeur en base64 et la recommitter"
      - "Copier le .env de production dans le dépôt pour comparer"
    answer: [1]
    explanation: "L'historique, les clones et les forks ont la valeur. La retirer du dernier commit ne la révoque pas. On crée une valeur nouvelle, on bascule, puis on révoque l'ancienne."

  - prompt: "Que versionne-t-on dans Git pour la base ? (plusieurs réponses)"
    multiple: true
    options:
      - "Le Deployment qui référence le Secret par son nom et sa clé"
      - "Le Secret rempli avec stringData et le mot de passe réel"
      - "Le ConfigMap des réglages non sensibles"
      - "Le .env du portable, pour que tout le monde ait localhost"
    answer: [0, 2]
    explanation: "On versionne la référence, pas la valeur. Le ConfigMap public oui. Le Secret rempli et le .env local non."

  - prompt: "Changer un ConfigMap met-il à jour les variables d'environnement des pods déjà lancés ?"
    options:
      - "Oui, immédiatement"
      - "Non, une variable d'environnement reste celle du démarrage tant que le pod n'est pas recréé"
      - "Oui, mais seulement si la valeur est en base64"
      - "Non, Kubernetes interdit de modifier un ConfigMap"
    answer: [1]
    explanation: "Le processus a lu l'environnement au démarrage. Un fichier monté peut être mis à jour plus tard, si l'application le relit. Le geste fiable est de recréer les pods, souvent via un hash dans une annotation."

  - prompt: "Quel ordre de rotation laisse le service debout ? (plusieurs réponses)"
    multiple: true
    options:
      - "Créer la nouvelle identité pendant que l'ancienne fonctionne encore"
      - "Révoquer l'ancienne avant de redémarrer les pods"
      - "Recréer les pods pour qu'ils lisent la nouvelle variable"
      - "Vérifier le trafic, puis seulement révoquer l'ancienne"
    answer: [0, 2, 3]
    explanation: "Le chevauchement évite la coupure. Les variables ne bougent pas toutes seules. Révoquer d'abord, puis redémarrer, éteint le service."

  - prompt: "Le .env du poste contient postgres://atelier:atelier@localhost:5432/atelier. Pourquoi est-il absurde dans le cluster ?"
    options:
      - "localhost dans le pod est le pod, pas la base, et le mot de passe du poste n'est pas celui de staging"
      - "Kubernetes réécrit localhost en nom de Service"
      - "Un .env force le niveau de logs à info"
      - "Compose et Kubernetes partagent ce fichier automatiquement"
    answer: [0]
    explanation: "Le .env décrit la machine du développeur. Dans le cluster, l'hôte est le Service, le secret vient d'un Secret, et debug n'est pas le niveau de production."

  - prompt: "COPY .env dans l'image a quelles conséquences ? (plusieurs réponses)"
    multiple: true
    options:
      - "Le secret du poste est dans un artefact que le registre distribue"
      - "L'hôte localhost ne mène pas à la base de staging"
      - "L'image reste identique d'un environnement à l'autre, ce qui est le but"
      - "Il faut retirer le fichier, l'ignorer, et faire tourner le mot de passe"
    answer: [0, 1, 3]
    explanation: "L'image ne doit pas porter la config d'un poste. On ajoute .env au .dockerignore, on injecte ConfigMap et Secret au déploiement, et on révoque ce qui a fuité."

  - prompt: "Qui devrait pouvoir lire les Secrets du namespace ?"
    options:
      - "Toute identité qui peut déjà déployer, sans distinction"
      - "Peu d'identités, moins largement que les ConfigMaps"
      - "Tous les namespaces du cluster"
      - "Le navigateur des clients, via le LoadBalancer"
    answer: [1]
    explanation: "Pouvoir déployer ne devrait pas vouloir dire pouvoir lire tous les secrets. Un dashboard qui affiche l'environnement des pods les montre aussi."

  - prompt: "stringData dans un manifeste sert à quoi, et ne sert pas à quoi ?"
    options:
      - "À écrire la valeur en clair à l'apply, Kubernetes l'encode ensuite. Ce n'est pas une raison de committer le fichier rempli"
      - "À chiffrer la valeur pour Git"
      - "À remplacer la rotation"
      - "À rendre le Secret lisible seulement par root sur le poste"
    answer: [0]
    explanation: "stringData est un confort d'écriture. Dans Git, c'est la valeur en clair. Le fichier commité avec le vrai mot de passe est déjà une fuite."

  - prompt: "Un certificat expire dans deux jours. Quand le renouveler ?"
    options:
      - "La nuit de l'expiration, en révoquant l'ancien d'abord"
      - "Avant l'échéance, le nouveau étant servi avant le retrait de l'ancien"
      - "Jamais, les certificats du cluster se tournent seuls sans redémarrage"
      - "En le collant dans le ConfigMap public"
    answer: [1]
    explanation: "La date se devance. Même séquence que pour un mot de passe : chevauchement, bascule des pods si l'application ne relit pas le fichier, puis retrait de l'ancien."

  - prompt: "À quoi sert un .env.example versionné ?"
    options:
      - "À publier les mots de passe de production sous un autre nom"
      - "À lister les clés nécessaires, sans valeur sensible"
      - "À remplacer le Secret du cluster"
      - "À fixer le digest de l'image"
    answer: [1]
    explanation: "L'exemple documente les clés. Les valeurs locales restent dans .env, gitignoré. L'écart localhost contre le nom du Service doit rester visible."

  - prompt: "Le chiffrement d'etcd change quoi par rapport à un Secret ordinaire ?"
    options:
      - "Il est actif dans tous les clusters, rien à vérifier"
      - "C'est un réglage du cluster, pas une propriété du YAML Secret"
      - "Il remplace la rotation et le RBAC"
      - "Il transforme le ConfigMap en coffre"
    answer: [1]
    explanation: "Sans chiffrement au repos, une sauvegarde d'etcd peut suffire à lire les Secrets. Même avec, qui a le droit get sur l'objet obtient la valeur. RBAC et coffre restent nécessaires."
