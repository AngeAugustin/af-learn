questions:
  - prompt: "La recette a validé commandes:1.8.3. Que doit recevoir la production ?"
    options:
      - "Une reconstruction depuis main une heure plus tard"
      - "Les mêmes octets, avec une autre configuration"
      - "Un dump des commandes réelles, pour que ce soit pareil"
      - "latest, plus simple à retenir"
    answer: [1]
    explanation: "Seuls la base, les jetons, les interrupteurs et le volume changent. Reconstruire ou copier les données des clients ne rapproche pas le comportement validé."

  - prompt: "Quelle exigence cache un déploiement roulant ?"
    options:
      - "L'ancien et le nouveau doivent accepter les mêmes commandes pendant la coexistence"
      - "Il faut deux parcs complets en permanence"
      - "Un seul exemplaire suffit à faire un pourcentage"
      - "La colonne lue par l'ancienne version peut être supprimée dans le même lot"
    answer: [0]
    explanation: "À mi-chemin, les deux versions répondent. Un champ obligatoire que 1.8.2 ne sait pas lire casse la moitié du trafic."

  - prompt: "Quand le bleu-vert n'est-il pas un vrai retour arrière ?"
    options:
      - "Quand le répartiteur peut rebasculer et que les deux versions lisent encore la base"
      - "Quand la base partagée a subi une migration destructive"
      - "Quand le vert a été vérifié sans trafic client"
      - "Quand on paie deux parcs le temps de la bascule"
    answer: [1]
    explanation: "Deux parcs et une donnée que l'ancienne couleur ne sait plus lire, c'est un big bang déguisé. Le coût double n'achète pas le retour."

  - prompt: "Pourquoi éviter de basculer bleu-vert seulement par un DNS au TTL d'une heure ?"
    options:
      - "Parce que le DNS est interdit en production"
      - "Parce qu'une partie des clients reste sur l'ancienne couleur longtemps, sans que le pipeline le montre"
      - "Parce que le TTL court doit être posé le jour même, pas avant"
      - "Parce que le répartiteur est toujours plus lent"
    answer: [1]
    explanation: "On commande un répartiteur tout de suite. Si le DNS sert quand même, son TTL est raccourci avant le jour de la bascule."

  - prompt: "Quelles conditions rendent un canari lisible ? (plusieurs réponses)"
    multiple: true
    options:
      - "Un répartiteur capable d'envoyer un pourcentage"
      - "Assez de trafic pour que la part observée veuille dire quelque chose"
      - "Un seuil d'arrêt écrit avant de commencer"
      - "Un seul processus, à 2 h, avec trois commandes par heure"
    answer: [0, 1, 2]
    explanation: "Sans deux exemplaires, il n'y a pas de pourcentage. Trois commandes ne prouvent pas le samedi des soldes. Le seuil se décide avant l'angoisse."

  - prompt: "À quoi sert l'interrupteur du second moyen de paiement ?"
    options:
      - "À déployer le code éteint, puis à l'exposer à l'équipe, puis plus largement"
      - "À se passer de tests sur le chemin allumé"
      - "À remplacer le numéro de version"
      - "À garder l'interrupteur dix ans sans date de retrait"
    answer: [0]
    explanation: "Déployer n'est pas exposer. Le chemin allumé s'exerce quand même. L'interrupteur se retire une fois le moyen stable, sinon il devient un second produit."

  - prompt: "Comment revient-on de 1.8.3 à la version saine précédente ?"
    options:
      - "En recopiant un dossier old sur le serveur"
      - "En redéployant l'artefact 1.8.2 encore au registre, par le même genre de job"
      - "En recompilant la branche d'hier soir sur la machine"
      - "En éteignant /sante"
    answer: [1]
    explanation: "Le retour arrière est un déploiement nommé. On l'a essayé en recette. La cible est la dernière version saine, pas une version plus ancienne au hasard."

  - prompt: "1.8.3 a rendu frais_detail obligatoire, puis le retour à 1.8.2 échoue à la lecture. Quand l'erreur a-t-elle été commise ?"
    options:
      - "Au moment du clic de retour"
      - "Dans le lot qui a cassé la compatibilité, avant même le déploiement"
      - "Dans le choix du nom semver mineur seulement"
      - "Dans le TTL du DNS"
    answer: [1]
    explanation: "Le retour du code était fictif dès la revue. On ajoute d'abord un champ facultatif, on roule, on ne supprime l'ancien que lorsque plus aucun ancien exemplaire ne tourne."

  - prompt: "Quels cas interdisent le big bang de l'API commandes ? (plusieurs réponses)"
    multiple: true
    options:
      - "Le retour arrière n'est pas nommé, ou la migration empêche de relire"
      - "Trois sujets partent ensemble la veille des soldes"
      - "Le pipeline n'a jamais déployé cet environnement"
      - "Un roulement compatible, un jeudi calme, signal déjà choisi"
    answer: [0, 1, 2]
    explanation: "Le roulement compatible n'est pas un big bang. L'interdire serait confondre la stratégie par défaut avec l'absence de stratégie."

  - prompt: "Jeudi 18 h, veille de soldes, la branche de douze jours n'a jamais vu le pipeline de production. Que peut encore partir ce soir ?"
    options:
      - "Les trois sujets, en une bascule, puisqu'il faut que ce soit là demain"
      - "Rien de cette branche. Une première de pipeline se fait en recette, un autre jour"
      - "Le second paiement, en canari, sur un seul exemplaire"
      - "La suppression de colonne groupée avec le nouveau code"
    answer: [1]
    explanation: "La date proche n'achète pas le droit de tout casser. On découpe. On n'introduit pas le lendemain matin ce que l'on a refusé le soir."

  - prompt: "Quatre exemplaires, arrondi compatible avec l'encaissement des deux versions. Quelle stratégie par défaut ?"
    options:
      - "Big bang"
      - "Roulant, en surveillant, avec retour de 1.8.2 sur les exemplaires déjà mis à jour si la courbe casse"
      - "Canari à 2 h sur trois commandes"
      - "Compilation sur le serveur"
    answer: [1]
    explanation: "Les versions peuvent coexister, pas besoin d'un second parc. S'arrêter au milieu sans remettre l'ancienne version laisse deux comportements de frais."

  - prompt: "Que ne prouve pas un interrupteur ? (plusieurs réponses)"
    multiple: true
    options:
      - "Que le chemin allumé a été testé"
      - "Que l'artefact est identifié et immutable"
      - "Que l'on peut exposer plus tard sans redéployer, si l'interrupteur est réel"
      - "Qu'il dispensera toujours d'un retrait du code mort"
    answer: [0, 1, 3]
    explanation: "La question porte sur ce que l'interrupteur ne prouve pas. Il ne teste pas à votre place, ne remplace pas la version, et ne doit pas rester éternel. Il permet bien, lui, d'exposer sans redéployer."

  - prompt: "Pendant un roulement, la courbe casse après deux exemplaires sur quatre. Que faites-vous ?"
    options:
      - "Vous finissez les deux derniers, puisque c'est commencé"
      - "Vous arrêtez et vous remettez 1.8.2 aussi sur les exemplaires déjà passés à 1.8.3"
      - "Vous supprimez la colonne tout de suite pour simplifier"
      - "Vous basculez le DNS avec un TTL d'une journée"
    answer: [1]
    explanation: "Finir propage le défaut. Un roulement à moitié laisse deux comportements sans l'avoir choisi. Le retour se fait sur tout le parc concerné."
