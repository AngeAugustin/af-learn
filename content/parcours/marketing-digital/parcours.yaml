slug: marketing-digital
title: Marketing digital
tagline: Attirer, convaincre et retenir, en mesurant ce que chaque canal rapporte vraiment.
description: >-
  Un parcours complet et orienté pratique pour faire du marketing digital : audience et
  entonnoir, positionnement, SEO et contenu, publicité, CRM et rétention, analytics,
  attribution, expérimentation et cadre légal. Chaque chapitre se termine par des exercices
  et une évaluation à valider avec au moins 75 %.
level: Débutant à avancé
color: sand
icon: megaphone
order: 10
status: published
prerequisites:
  - Savoir lire un taux, un coût et un graphique simple
  - Avoir déjà vu un site, une campagne ou une newsletter en tant que client
  - Aucune expérience préalable en publicité ou en SEO n'est requise
outcomes:
  - Décrire un entonnoir et choisir le canal qui correspond à l'étape
  - Formuler un positionnement et un message pour une audience précise
  - Construire une base de SEO et de contenu mesurable
  - Lire une campagne payante (enchère, ciblage, créatif, retour)
  - Scénariser un cycle d'e-mails et une action de rétention
  - Relier analytics, attribution et indicateurs à une décision
  - Proposer un test et respecter le consentement et le RGPD
