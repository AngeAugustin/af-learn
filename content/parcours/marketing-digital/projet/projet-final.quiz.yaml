questions:
  - prompt: "Le message de Léa, « faites du digital, un influenceur, une promo, des impressions », est :"
    options:
      - "Le livrable à signer tel quel"
      - "Le point de départ, pas le brief"
      - "L'objectif ratable"
      - "Le hors périmètre à inclure dans l'offre"
    answer: [1]
    explanation: "La copie raconte les chiffres du mandat. Elle ne recopie pas « que ça vive »."

  - prompt: "Quel chiffre n'a-t-on pas le droit de remplacer par un nombre rond plus simple ?"
    options:
      - "Le panier de 42 € et la marge de 60 %"
      - "La couleur du site"
      - "L'heure du comité"
      - "Le prénom d'un client"
    answer: [0]
    explanation: "42 €, 25,20 €, 18 €, 25 €, 8 000 € et les cinq enveloppes sont le réel du cas. Les simplifier rate l'exercice."

  - prompt: "L'objectif recevable promet :"
    options:
      - "212 ventes et des impressions en hausse"
      - "Un CPA visé à 18 €, un arrêt à 25 €, les gros codes sous 15 %, sans volume garanti"
      - "D'exister cet été"
      - "Un influenceur et une refonte"
    answer: [1]
    explanation: "212 est un calcul d'hypothèse search, pas un engagement. Les impressions ne sont pas le succès."

  - prompt: "Où vont les clients déjà connus dans le brief ?"
    options:
      - "Dans l'audience « tous les adultes »"
      - "Vers Nora, avec consentement, pas dans la pub froide"
      - "Dans un fichier acheté"
      - "Dans le hors périmètre des e-mails de service"
    answer: [1]
    explanation: "Les mélanger à l'acquisition froide rend le CPA illisible et risque d'écrire sans oui."

  - prompt: "Le message search recevable :"
    options:
      - "Parle du coffret à 78 € et envoie vers sa fiche"
      - "Parle à la fois du coffret, de la bougie à 42 € et d'un code"
      - "Envoie vers l'accueil"
      - "Promet un sommeil sans anxiété"
    answer: [0]
    explanation: "Une offre, une page. Le délai de 48 h seulement si le stock le permet. Pas de seconde offre dans le même texte."

  - prompt: "L'e-mail du jour 50 recevable :"
    options:
      - "Demande un avis, offre −20 % et vend le coffret"
      - "Vise la deuxième commande au prix normal, un seul lien, segment un seul achat"
      - "Part à toute la base, désinscrits compris"
      - "Part le lendemain de l'achat"
    answer: [1]
    explanation: "Une bougie d'environ 45 heures. Consentement oui, sortie si la personne a déjà racheté. Pas de second objectif."

  - prompt: "Search 640 €, 40 commandes caisse, outil 48. Le CPA de pilotage est :"
    options:
      - "13 €, sur 48"
      - "16 €, sur 40"
      - "25 €"
      - "42 €"
    answer: [1]
    explanation: "L'écart est d'environ 20 %, pas un tiers. On ne scale pas sur le chiffre le plus beau. Palier possible si le stock tient."

  - prompt: "Social 300 €, 8 commandes, CPA 37,50 €. Le verbe est :"
    options:
      - "Palier, pour ne pas laisser d'argent"
      - "Figer, la coupure viendra si on atteint 400 € en restant au-dessus de 25 €"
      - "Le sauver par la moyenne avec le search"
      - "Lancer un code"
    answer: [1]
    explanation: "Marge du social négative d'environ 98 €. L'étoile globale peut rester positive grâce au search. On ne moyenne pas."

  - prompt: "Le test couloir contre packshot est irrecevable si :"
    options:
      - "La phrase, la page et le prix 42 € sont les mêmes"
      - "On change aussi le code et la page, ou on couronne un gagnant lundi midi sur 3 clics"
      - "La lecture est dimanche"
      - "On archive trois lignes ensuite"
    answer: [1]
    explanation: "Une variable, une date de lecture, des garde-fous seulement pour le prix, le stock ou la page cassée."

  - prompt: "Les cinq enveloppes, dans l'ordre search, social, production, crédits, réserve, sont :"
    options:
      - "3 400, 2 200, 600, 800, 1 000"
      - "2 200, 3 400, 1 000, 800, 600"
      - "4 000, 4 000, 0, 0, 0"
      - "1 333 six fois"
    answer: [0]
    explanation: "La somme fait 8 000. Le social n'est pas le plus gros. La réserve n'est pas fondue dans la semaine 1."

  - prompt: "Quels défauts rendent le dossier irrecevable ? (plusieurs réponses)"
    multiple: true
    options:
      - "L'objectif promet 212 ventes et cite les impressions"
      - "Un message empile deux offres ou une promesse de soin"
      - "Les seuils 18 € et 25 € sont écrits et appliqués"
      - "Le test se juge le premier jour"
    answer: [0, 1, 3]
    explanation: "Vague, mensonger, ou trop tôt : on ne signe pas. Des seuils appliqués, au contraire, sont le cœur du dossier."

  - prompt: "Que doit-on voir dans les trois messages ? (plusieurs réponses)"
    multiple: true
    options:
      - "Un search qui dit 78 € et la page du coffret"
      - "Un social à 42 €, sans fausse rareté ni soin"
      - "Un e-mail de jour 50 à prix normal, un seul objectif"
      - "Le même −30 % dans les trois"
    answer: [0, 1, 2]
    explanation: "Trois pièces, trois travaux. Le −30 % est hors périmètre et casserait la marge utilisée pour les seuils."

  - prompt: "Marge search de la semaine témoin : 40 × 25,20 − 640. Elle vaut :"
    options:
      - "368 €"
      - "640 €"
      - "−98 €"
      - "1 000 €"
    answer: [0]
    explanation: "1 008 − 640 = 368. Le social, lui, est autour de −98 €. On n'additionne pas pour déclarer les deux sains."
