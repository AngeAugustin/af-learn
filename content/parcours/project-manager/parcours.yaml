slug: project-manager
title: Project Manager
tagline: Cadrer, planifier et mener un projet jusqu'à un résultat que les parties prenantes acceptent.
description: >-
  Un parcours complet et orienté pratique pour devenir Project Manager : cycle de vie,
  parties prenantes, périmètre et priorités, planification, agile et kanban, risques,
  qualité, changements, animation d'équipe, budget, fournisseurs, pilotage et clôture.
  Chaque chapitre se termine par des exercices et une évaluation à valider avec au moins 75 %.
level: Débutant à avancé
color: amber
icon: kanban
order: 9
status: published
prerequisites:
  - Avoir déjà participé à un projet d'équipe, même modeste
  - Être à l'aise pour écrire un compte-rendu clair
  - Aucune expérience préalable de chef de projet n'est requise
outcomes:
  - Situer le Project Manager et choisir un cycle de vie adapté
  - Cadrer un objectif, un périmètre et des critères de succès
  - Découper, estimer et ordonnancer un planning avec des jalons
  - Animer un backlog, des rituels agiles ou un flux kanban
  - Tenir un registre des risques, de la qualité et des changements
  - Communiquer avec les parties prenantes et l'équipe
  - Suivre un budget, un fournisseur et des engagements
  - Clôturer un projet et capitaliser ce qui a été appris
