slug: business-analyst
title: Business Analyst
tagline: Traduire un besoin métier en exigences claires, traçables et recettables.
description: >-
  Un parcours complet et orienté pratique pour devenir Business Analyst : rôle, processus,
  exigences, user stories, modélisation, écart entre l'existant et la cible, ateliers,
  traçabilité, recette métier et conduite du changement. Chaque chapitre se termine par des
  exercices et une évaluation à valider avec au moins 75 %.
level: Débutant à avancé
color: pine
icon: clipboard
order: 12
status: published
prerequisites:
  - Avoir déjà décrit un processus de travail, même informellement
  - Être à l'aise pour écrire de façon précise
  - Aucune expérience préalable d'analyse d'affaires ou de modélisation n'est requise
outcomes:
  - Situer le Business Analyst face au métier, au Product Manager et au projet
  - Décrire un processus existant, ses acteurs et ses irritants
  - Rédiger des exigences, des histoires et des critères d'acceptation
  - Modéliser un processus, des informations et des règles de gestion
  - Comparer l'existant et la cible, puis argumenter une option
  - Animer un atelier et garder la trace des décisions
  - Préparer une recette métier et l'accompagnement du changement
