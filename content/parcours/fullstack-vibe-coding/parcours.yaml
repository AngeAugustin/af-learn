slug: fullstack-vibe-coding
title: Développement fullstack & Vibe coding
tagline: Construire des applications web complètes, de l'interface à la base de données, en tirant parti de l'IA.
description: >-
  Un parcours complet et pratique pour devenir développeur fullstack à l'ère de l'IA : fondations du
  web (HTML, CSS, HTTP), JavaScript, TypeScript et l'outillage Node.js, interfaces avec React et Tailwind, applications
  complètes avec Next.js (référencement, accessibilité, internationalisation), API et bases de données,
  fonctionnalités backend courantes (fichiers, e-mails, paiements, tâches de fond), authentification,
  tests et qualité, déploiement et architecture, intégration de LLM et agents de code, puis le « vibe coding » : développer efficacement et sûrement avec des assistants IA. Chaque
  chapitre se termine par des exercices et une évaluation à valider avec au moins 75 %.
level: Débutant à avancé
domain: Développement
skills:
  - TypeScript
  - React
  - Next.js
  - API et bases de données
  - Vibe coding
color: blue
icon: code
order: 4
status: published
prerequisites:
  - Être à l'aise avec un ordinateur et la ligne de commande
  - Aucune expérience de développement web n'est requise
  - De la curiosité et l'envie de construire des projets
outcomes:
  - Maîtriser HTML, CSS et le fonctionnement du web
  - Programmer en JavaScript et TypeScript modernes et maîtriser l'outillage Node.js
  - Construire des interfaces accessibles avec React et des applications complètes avec Next.js
  - Concevoir des API, travailler avec une base de données et intégrer fichiers, e-mails, paiements et tâches de fond
  - Gérer l'authentification, tester, déployer et faire monter en charge une application
  - Intégrer un LLM dans une application et développer avec des agents de code de façon efficace, critique et sûre
