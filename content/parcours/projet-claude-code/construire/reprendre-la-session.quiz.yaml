questions:
  - prompt: "Le lendemain matin, comment reprenez-vous le travail sur App Sève ?"
    options:
      - "En collant le transcript entier d'hier comme prompt"
      - "En ouvrant une session neuve dans le dossier du projet"
      - "En rejouant d'abord le paiement esquissé la veille"
      - "En recopiant les deux cents lignes de la soirée"
    answer: [1]
    explanation: "La session neuve ne ramène pas les détours. Le travail continue parce que les fichiers sont là, pas parce que le chat s'en souvient."

  - prompt: "Que ramène une reprise du transcript, avec claude -c ou /resume ?"
    options:
      - "Uniquement les trois lignes d'état"
      - "La conversation d'hier, y compris les détours"
      - "Seulement docs/brief.md, sans aucun échange"
      - "Une commande de paiement, et rien d'autre"
    answer: [1]
    explanation: "Recharger l'historique ramène aussi un paiement esquissé ou un plan à 10 places. Ce chapitre choisit la session neuve."

  - prompt: "Pourquoi préférer cette session neuve ?"
    options:
      - "Pour être obligé de redicter la vie de Léa"
      - "Pour ne pas faire revenir les détours déjà écartés"
      - "Parce que CLAUDE.md ne peut pas être relu le matin"
      - "Parce que le brief expire chaque soir"
    answer: [1]
    explanation: "Les fichiers portent le cadre. Le transcript porte aussi les fausses pistes. On garde les fichiers."

  - prompt: "Que relit la session neuve sans que vous colliez la page ?"
    options:
      - "CLAUDE.md, qui pointe vers docs/brief.md"
      - "Le SMS de rappel oublié par Léa"
      - "L'histoire orale du four et des émaux"
      - "Uniquement le transcript de la veille"
    answer: [0]
    explanation: "CLAUDE.md est chargé à l'ouverture. Il pointe vers la page. Les garde-fous y sont déjà : 8 places, attente 12, 18 h, pas de paiement."

  - prompt: "Quelles sont les trois lignes du matin ?"
    options:
      - "Incrément en cours, dernier test, ce qu'il ne faut pas refaire"
      - "Le récit complet, les 70 %, et les 3 absents recopiés"
      - "Trois incréments à coder dans la même session"
      - "Trois prestataires de paiement à comparer"
    answer: [0]
    explanation: "Les trois lignes sont l'état, pas un second brief. Le récit et les chiffres restent dans docs/brief.md."

  - prompt: "Où écrivez-vous ces trois lignes ?"
    options:
      - "En tête de CLAUDE.md, à la place de celles de la veille"
      - "En bas du fichier, empilées jour après jour"
      - "Dans le transcript seulement, pas dans un fichier"
      - "À la place de docs/brief.md, qu'on efface"
    answer: [0]
    explanation: "On remplace. Empiler lundi et mardi fait hésiter la session entre deux incréments ou deux résultats de test."

  - prompt: "Pourquoi répéter « pas de paiement » sur la troisième ligne ?"
    options:
      - "Pour contredire le brief, qui autorise l'encaissement"
      - "Pour fermer un chemin esquissé la veille, en plus de la règle déjà écrite"
      - "Pour autoriser l'encaissement juste le matin"
      - "Pour remplacer le nombre de 8 places"
    answer: [1]
    explanation: "La règle est dans le brief. La ligne d'état ferme en plus la piste ouverte hier, afin qu'elle ne redémarre pas."

  - prompt: "Quel est le premier message du matin ?"
    options:
      - "La soirée entière, collée pour le contexte"
      - "Relire CLAUDE.md et le brief, incrément en cours seulement, commande avant d'éditer"
      - "« Répare tout »"
      - "Passe l'attente de 12 à 30"
    answer: [1]
    explanation: "Le message est court parce que les fichiers sont relus. On demande la commande de vérification avant une édition."

  - prompt: "Un collègue colle 200 lignes d'hier, dont un moment à 10 places et un paiement esquissé. Vous gardez..."
    options:
      - "Les 200 lignes, sinon la session ne comprendra pas"
      - "Les fichiers et les trois lignes, pas ce collage"
      - "Le passage à 10 places, comme nouvelle règle"
      - "Le paiement esquissé, pour le terminer"
    answer: [1]
    explanation: "Les 10 places et le paiement sont ce qu'une session neuve doit oublier. S'il reste un échec ouvert, on colle cette sortie-là, pas la soirée."

  - prompt: "Les lignes disent encore « incrément 1, liste incomplète », alors que vous en êtes à l'attente et que la liste est tenue. Vous..."
    options:
      - "Les laissez : l'historique rassure la session"
      - "Les remplacez par l'incrément 3, le dernier test tenu, et l'interdiction de paiement"
      - "Ajoutez une quatrième ligne sans effacer les anciennes"
      - "Revenez au paiement, puisque les lignes sont vieilles"
    answer: [1]
    explanation: "Des lignes périmées sont une mauvaise consigne : la session peut rouvrir la liste. On remplace, on n'empile pas un journal."

  - prompt: "Vous ne savez plus si le dernier test était vert. Vous..."
    options:
      - "Inventez une ligne verte dans CLAUDE.md"
      - "Relancez la commande, lisez la sortie, et la deuxième ligne copie ce que vous voyez"
      - "Collez le transcript de la veille"
      - "Sautez directement à l'incrément 4"
    answer: [1]
    explanation: "On n'invente pas une preuve. La deuxième ligne copie une sortie fraîche, lue par vous."

  - prompt: "Quelles lignes écrivez-vous le matin de l'incrément 2 ? (plusieurs réponses)"
    multiple: true
    options:
      - "Incrément en cours : 2, refus de la 9e place"
      - "Dernier test : 12 stages affichés, formulaire non ouvert"
      - "Ne pas refaire : pas de paiement"
      - "Le transcript des essais où la page affichait 10 places"
    answer: [0, 1, 2]
    explanation: "Trois lignes d'état, pas la soirée. Le passage à 10 places ne revient pas dans le fichier."

  - prompt: "Qu'est-ce que vous ne recollez pas au matin ? (plusieurs réponses)"
    multiple: true
    options:
      - "La page entière du brief"
      - "Le transcript, avec le paiement esquissé"
      - "Les trois lignes d'état, qui remplacent celles de la veille"
      - "Les essais déjà écartés, comme un passage à 10 places"
    answer: [0, 1, 3]
    explanation: "La page est relue depuis le fichier, le transcript et les détours restent dehors. Les trois lignes, elles, s'écrivent."
