questions:
  - prompt: "Pourquoi une clé n'entre-t-elle pas dans CLAUDE.md ?"
    options:
      - "Parce que le fichier est ignoré par Git et n'est jamais relu"
      - "Parce qu'il est commité et relu dans chaque session"
      - "Parce que Léa préfère le prix dans un .env public"
      - "Parce que les règles des 8 places y sont interdites"
    answer: [1]
    explanation: "CLAUDE.md porte les règles de Sève. Une clé s'y copie dans le dépôt, le diff et le contexte."

  - prompt: "Que peut contenir CLAUDE.md pour l'Atelier Sève ?"
    options:
      - "Le jeton du SMS, pour tester les trois absents"
      - "45 €, 8 places, attente jusqu'à 12, décision avant 18 h la veille"
      - "Le fichier .env en entier"
      - "Bash(*), pour ne plus lire les commandes"
    answer: [1]
    explanation: "Les chiffres de Léa y ont leur place. Les secrets et l'ouverture du shell n'y ont pas la leur."

  - prompt: "Où vit une clé qui ne doit pas être poussée ?"
    options:
      - "Dans un .env ignoré par Git, jamais commité"
      - "Dans docs/brief.md, pour que chaque session l'ait"
      - "Dans le message de commit, entre guillemets"
      - "Dans le nom du test « la 9e place est refusée »"
    answer: [0]
    explanation: "Le .env reste local. Un exemple peut nommer la variable sans valeur réelle. Une clé déjà commitée se révoque."

  - prompt: "Quelle allowlist commettez-vous dans .claude/settings.json si CLAUDE.md nomme node --test ?"
    options:
      - "Bash(*)"
      - "Bash(node --test), sans astérisque"
      - "Toutes les commandes, plus la lecture du .env"
      - "Aucune règle, et le mode qui ne demande plus rien"
    answer: [1]
    explanation: "La commande exacte du test peut passer sans redemander. Bash(*) ouvre le shell entier."

  - prompt: "Que devient .claude/settings.local.json ?"
    options:
      - "Il se commite avec l'équipe, surtout s'il contient Bash(*)"
      - "Il reste sur votre machine et hors de Git"
      - "Il remplace docs/brief.md"
      - "Il publie le prix de 45 € sur la page"
    answer: [1]
    explanation: "Le fichier local n'est pas une cachette pour une allowlist large. Hors de Git, Bash(*) agit encore sur le dépôt de Léa."

  - prompt: "Qui tient le prix, le plafond et l'heure ?"
    options:
      - "L'agent, qui peut les déplacer pour un test vert"
      - "Léa, et l'agent les applique sans les négocier"
      - "Le contrôle continu, qui choisit 40 € si c'est plus simple"
      - "Le test, qui a le dernier mot sur 8 ou 9 places"
    answer: [1]
    explanation: "45 €, 8 places et 18 h la veille ne bougent que si Léa le dit par écrit dans le dépôt."

  - prompt: "Le test « la 9e place est refusée » échoue. L'agent veut écrire 9 dans la règle et dans CLAUDE.md. Que reste-t-il ?"
    options:
      - "8 places, et le comportement à corriger"
      - "9 places jusqu'à la démo, 8 ensuite"
      - "10 places, pour avoir de la marge sur les trois absents"
      - "Aucune limite, le remplissage à 70 % suffit"
    answer: [0]
    explanation: "L'agent n'assouplit pas la règle des 8 places pour faire passer un test. La session suivante lirait 9 comme la règle."

  - prompt: "« Fais passer le test » veut dire quoi, ici ?"
    options:
      - "Le comportement rejoint la règle de Léa"
      - "La règle rejoint l'assertion qui échoue"
      - "On commente le test et on commite"
      - "On met la clé dans CLAUDE.md pour débloquer la suite"
    answer: [0]
    explanation: "Un échec sur la 9e place se corrige dans le refus. Le plafond, l'attente et l'heure ne se plient pas."

  - prompt: "Quels fichiers ou réglages ne partent pas dans le commit ?"
    multiple: true
    options:
      - "Le .env qui contient une clé"
      - "Une clé collée dans CLAUDE.md"
      - "Bash(node --test) dans settings.json, si c'est la commande du dépôt"
      - "settings.local.json avec une allowlist plus large"
    answer: [0, 1, 3]
    explanation: "La commande de test nommée peut être partagée. Le secret, la clé dans CLAUDE.md et le fichier local restent dehors."

  - prompt: "Une clé a déjà été commitée. Quelle suite tenez-vous ?"
    options:
      - "Effacer la ligne au commit suivant et garder la même clé"
      - "La retirer, la révoquer, en créer une neuve hors dépôt"
      - "La déplacer dans le message de revue pour Léa"
      - "La laisser, puisque les trois absents justifient le SMS"
    answer: [1]
    explanation: "Effacer la ligne laisse l'ancienne dans l'historique. Les absents expliquent le rappel, ils ne publient pas l'accès."

  - prompt: "Quelles propositions de l'agent reste-t-il permis d'examiner ?"
    multiple: true
    options:
      - "Un plan pour refuser la 9e place"
      - "La commande de démarrage, que vous lirez"
      - "Passer le samedi à 20 h pour simplifier le test"
      - "Committer le .env « pour l'autre machine »"
    answer: [0, 1]
    explanation: "Lire, planifier, proposer une commande et montrer un diff restent ouverts. Le prix, l'heure, le plafond et les secrets ne se négocient pas."

  - prompt: "L'agent propose 40 €, 10 places et 20 h « pour un test plus simple ». Que répondez-vous ?"
    options:
      - "Vous acceptez les trois, le vert d'abord"
      - "Vous gardez 45 €, 8 places et 18 h la veille"
      - "Vous ne gardez que 20 h, le prix peut bouger"
      - "Vous mettez les trois valeurs dans le .env commité"
    answer: [1]
    explanation: "Ces trois décisions sont à Léa. Un compromis de session ne devient pas la règle du lendemain."

  - prompt: "Où se révoque une allowlist Bash(*) déjà écrite dans le fichier partagé ?"
    options:
      - "On la laisse, elle ne concerne que la forge"
      - "On la retire du diff avant le commit, et on ne la cache pas dans le fichier local"
      - "On la déplace dans CLAUDE.md"
      - "On l'accompagne d'une clé SMS pour limiter les dégâts"
    answer: [1]
    explanation: "Bash(*) se retire. Le fichier local ne devient pas sa cachette. CLAUDE.md ne porte ni la clé ni le shell ouvert."
