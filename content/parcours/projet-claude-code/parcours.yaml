slug: projet-claude-code
title: Développer un projet de bout en bout avec Claude Code
tagline: Mener un vrai produit depuis le terminal, du brief au diff relu.
description: >-
  Un parcours complet et orienté pratique pour mener un projet de bout en bout avec Claude
  Code : session et permissions, CLAUDE.md, skills, mode plan, boucle de l'agent, sous-agents,
  hooks, tests, Git, MCP, revue, injection de consignes, données qui sortent de la
  machine, lectures interdites, dépendances et sécurité de la page. Le fil rouge est Atelier Sève, le même stage de
  céramique, mené cette fois depuis le terminal. Chaque chapitre se termine par des exercices
  et une évaluation à valider avec au moins 75 %.
level: Débutant à avancé
domain: Développement
skills:
  - Claude Code
  - Terminal
  - CLAUDE.md
  - Permissions
  - Sécurité
  - Git
color: ember
icon: terminal
order: 15
status: published
prerequisites:
  - Avoir déjà modifié un petit projet (HTML, JavaScript ou équivalent)
  - Savoir lancer des commandes dans un terminal et utiliser Git
  - Aucune maîtrise préalable de Claude Code n'est requise
outcomes:
  - Ouvrir une session Claude Code et choisir un mode de permission adapté
  - Écrire un CLAUDE.md et des skills que l'agent retrouve à chaque session
  - Obtenir un plan en lecture seule avant d'autoriser des écritures
  - Tenir la boucle lire, modifier, vérifier, et déléguer une exploration à un sous-agent
  - Poser un hook, faire tourner les tests et relire le diff avant de committer
  - Connecter un outil MCP sans élargir les permissions au-delà du besoin
  - Vérifier le parcours du commanditaire et garder les secrets hors du dépôt
  - Écarter une consigne cachée, une donnée personnelle et une dépendance non relue
